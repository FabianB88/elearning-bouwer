<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>E-learning Bouwer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Werkplaats in drie banen: structuur links, het blok dat je bewerkt in het
   midden, de echte speler rechts. Groen zoals de minor, de speler houdt zijn
   eigen warme palet. */
:root {
  --bg: #f1f3ee;
  --paneel: #ffffff;
  --vlak: #f6f7f3;
  --lijn: #dde2d8;
  --tekst: #1c2b24;
  --tekst-2: #5d6d65;
  --tekst-3: #87958d;
  --accent: #2c6a4d;
  --accent-sterk: #1f5039;
  --accent-zacht: #e2eee6;
  --op-accent: #ffffff;
  --waarschuwing: #a8521f;
  --waarschuwing-zacht: #f8eadf;
  --gevaar: #b23a2e;
  --gevaar-zacht: #f9e5e2;
  --schaduw: 0 10px 30px rgba(20, 40, 30, 0.12);
  --f-kop: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-tekst: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --paneel: #181f1b; --vlak: #1e2621; --lijn: #2b3630;
    --tekst: #e5ece7; --tekst-2: #a3b2a9; --tekst-3: #77877e;
    --accent: #7cc39a; --accent-sterk: #a3dbb9; --accent-zacht: #203a2c; --op-accent: #0f1a14;
    --waarschuwing: #e2a172; --waarschuwing-zacht: #3a2a1d; --gevaar: #ef8b7f; --gevaar-zacht: #3b2220;
    --schaduw: 0 10px 30px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --paneel: #181f1b; --vlak: #1e2621; --lijn: #2b3630;
  --tekst: #e5ece7; --tekst-2: #a3b2a9; --tekst-3: #77877e;
  --accent: #7cc39a; --accent-sterk: #a3dbb9; --accent-zacht: #203a2c; --op-accent: #0f1a14;
  --waarschuwing: #e2a172; --waarschuwing-zacht: #3a2a1d; --gevaar: #ef8b7f; --gevaar-zacht: #3b2220;
  --schaduw: 0 10px 30px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--tekst);
  font-family: var(--f-tekst);
  font-size: 14px;
  overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paneel); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-kop); letter-spacing: -0.01em; text-wrap: balance; margin: 0; }

.app { height: 100%; display: flex; flex-direction: column; }

/* ---------------------------------------------------------------- bovenbalk */
.bovenbalk {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  min-height: 56px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--paneel);
  border-bottom: 1px solid var(--lijn);
}
.merk { display: flex; align-items: center; gap: 10px; font-family: var(--f-kop); font-weight: 800; font-size: 15px; white-space: nowrap; }
.merk-teken { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--op-accent); display: grid; place-items: center; }
.cursuskeuze { min-width: 0; flex: 1 1 220px; max-width: 360px; }
.cursuskeuze select { width: 100%; }
.status { font-size: 12px; color: var(--tekst-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tekst-3); }
.status[data-soort="ok"]::before { background: var(--accent); }
.status[data-soort="bezig"]::before { background: var(--waarschuwing); }
.status[data-soort="fout"]::before { background: var(--gevaar); }
.bovenbalk .acties { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- knoppen en velden */
.knop {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 36px; padding: 7px 13px;
  border: 1px solid var(--lijn); border-radius: 8px;
  background: var(--paneel); color: var(--tekst);
  font-weight: 600; font-size: 13px; white-space: nowrap;
}
.knop:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-sterk); }
.knop.primair { background: var(--accent); border-color: var(--accent); color: var(--op-accent); }
.knop.primair:hover:not(:disabled) { background: var(--accent-sterk); border-color: var(--accent-sterk); color: var(--op-accent); }
.knop.claude { border-color: var(--accent); color: var(--accent-sterk); background: var(--accent-zacht); }
.knop.gevaar { color: var(--gevaar); }
.knop.gevaar.vast { background: var(--gevaar); border-color: var(--gevaar); color: #fff; }
.knop.klein { min-height: 30px; padding: 4px 10px; font-size: 12px; }
.knop:disabled { opacity: 0.5; cursor: default; }
.icoonknop {
  width: 30px; height: 30px; display: inline-grid; place-items: center;
  border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--tekst-2);
}
.icoonknop:hover:not(:disabled) { background: var(--vlak); color: var(--tekst); border-color: var(--lijn); }
.icoonknop:disabled { opacity: 0.35; cursor: default; }
.icoonknop svg, .knop svg { width: 16px; height: 16px; flex: 0 0 auto; }

input[type="text"], input[type="url"], input[type="number"], select, textarea {
  width: 100%; box-sizing: border-box;
  padding: 8px 10px;
  border: 1px solid var(--lijn); border-radius: 8px;
  background: var(--paneel);
  font-size: 13.5px; line-height: 1.45;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus, .rijk:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-zacht); }
.veld { display: grid; gap: 5px; min-width: 0; }
.veld > label, .veldlabel { font-size: 11.5px; font-weight: 600; color: var(--tekst-2); letter-spacing: 0.02em; }
.veld .hulp { font-size: 11.5px; color: var(--tekst-3); line-height: 1.45; }
.velden { display: grid; gap: 12px; }
.twee { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
/* Grids krimpen mee met het scherm in plaats van mee te groeien met lange inhoud. */
.editor, .editor-kop, .blokken, .velden, .veld, .blok-body, .reeks, .reeks-item, .palet, .dialoog, .keuzelijst { grid-template-columns: minmax(0, 1fr); }
.schakel { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tekst); }
.schakel input { width: 16px; height: 16px; accent-color: var(--accent); }

/* ---------------------------------------------------------------- werkruimte */
.werk {
  flex: 1 1 auto; min-height: 0;
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr) minmax(380px, 40%);
}
.baan { min-height: 0; overflow: auto; }
.baan-structuur { background: var(--paneel); border-right: 1px solid var(--lijn); }
.baan-voorbeeld { display: flex; flex-direction: column; border-left: 1px solid var(--lijn); background: var(--vlak); overflow: hidden; }
.segment-keuze.tabs-smal { display: none; }
.tabs-smal .alleen-mobiel { display: none; }

.sectie { padding: 18px 16px; border-bottom: 1px solid var(--lijn); }
.sectie-kop { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.sectie-kop h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--tekst-2); font-weight: 700; }

.modulelijst { display: grid; gap: 4px; margin: 0 0 12px; padding: 0; list-style: none; }
.module-item {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 7px 6px 7px 8px; border-radius: 8px; border: 1px solid transparent;
}
.module-item:hover { background: var(--vlak); }
.module-item.actief { background: var(--accent-zacht); border-color: var(--accent); }
.module-item .nr { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--vlak); color: var(--tekst-2); border: 1px solid var(--lijn); }
.module-item.actief .nr { background: var(--accent); border-color: var(--accent); color: var(--op-accent); }
.module-item .kies { text-align: left; background: none; border: 0; padding: 0; min-width: 0; }
.module-item .kies strong { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.module-item .kies small { display: block; font-size: 11px; color: var(--tekst-3); margin-top: 1px; }
.module-item .mini { display: flex; gap: 0; opacity: 0; }
.module-item:hover .mini, .module-item.actief .mini, .module-item:focus-within .mini { opacity: 1; }
.knoprij { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- editor */
.baan-editor { padding-block: 22px 120px; padding-left: max(16px, 3vw); padding-right: max(16px, 3vw); }
.editor { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
.editor-kop { display: grid; gap: 12px; padding-bottom: 6px; }
.editor-kop .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); font-weight: 700; }
.editor-kop .titelveld { font-family: var(--f-kop); font-size: 22px; font-weight: 800; padding: 8px 10px; }
.editor-kop .rij { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.editor-kop .rij .veld { flex: 1 1 200px; }

.blokken { display: grid; gap: 0; }
.blok-kaart {
  background: var(--paneel);
  border: 1px solid var(--lijn);
  border-radius: var(--r);
  transition: border-color 0.12s ease, box-shadow 0.12s ease;
}
.blok-kaart.gekozen { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-zacht); }
.blok-kop { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; min-height: 42px; }
.blok-kop .type { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--tekst-2); background: none; border: 0; padding: 4px 0; }
.blok-kop .type svg { width: 15px; height: 15px; color: var(--accent); }
.blok-kop .samenvatting { flex: 1; min-width: 0; font-size: 12.5px; color: var(--tekst-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blok-kop .acties { display: flex; gap: 0; }
.blok-body { padding: 4px 14px 16px; display: grid; gap: 12px; }
.blok-kaart.dicht .blok-body { display: none; }
.waarschuwing { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--waarschuwing); background: var(--waarschuwing-zacht); padding: 3px 8px; border-radius: 6px; }

.blok-kaart.doorgaan-kaart { background: transparent; border-style: dashed; }
.blok-kaart.doorgaan-kaart .blok-kop .samenvatting { text-align: center; }

.invoegen { position: relative; height: 14px; display: grid; place-items: center; }
.invoegen button {
  opacity: 0; transition: opacity 0.12s ease;
  font-size: 11.5px; font-weight: 600; color: var(--accent-sterk);
  background: var(--paneel); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 10px;
  position: relative; z-index: 1;
}
.invoegen::before { content: ""; position: absolute; left: 12px; right: 12px; top: 50%; border-top: 1px dashed var(--accent); opacity: 0; transition: opacity 0.12s ease; }
.invoegen:hover button, .invoegen:hover::before, .invoegen button:focus-visible, .invoegen.open button, .invoegen.open::before { opacity: 1; }

.toevoegen-onder { margin-top: 14px; display: grid; }
.toevoegen-onder > .knop { justify-self: start; }

.palet {
  margin: 8px 0 12px;
  background: var(--paneel); border: 1px solid var(--accent); border-radius: var(--r);
  box-shadow: var(--schaduw); padding: 14px;
  display: grid; gap: 12px;
}
.palet-groep h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--tekst-2); margin-bottom: 6px; font-family: var(--f-tekst); font-weight: 700; }
.palet-knoppen { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.palet-knoppen button {
  display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; align-items: start; text-align: left;
  padding: 8px 10px; border: 1px solid var(--lijn); border-radius: 8px; background: var(--paneel);
}
.palet-knoppen button:hover { border-color: var(--accent); background: var(--accent-zacht); }
.palet-knoppen svg { width: 16px; height: 16px; color: var(--accent); margin-top: 1px; grid-row: span 2; }
.palet-knoppen strong { font-size: 12.5px; }
.palet-knoppen small { font-size: 11px; color: var(--tekst-3); line-height: 1.35; }

/* reeksen van onderdelen in een blok: tabbladen, opties, paren */
.reeks { display: grid; gap: 8px; }
.reeks-item { border: 1px solid var(--lijn); border-radius: 8px; padding: 10px; background: var(--vlak); display: grid; gap: 8px; }
.reeks-item-kop { display: flex; align-items: center; gap: 6px; }
.reeks-item-kop .nr { font-size: 11px; font-weight: 700; color: var(--tekst-3); min-width: 18px; }
.reeks-item-kop .ruimte { flex: 1; }
.reeks-rij { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.reeks-rij.drie { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
.reeks-rij .icoonknop { margin-top: 3px; }
.juist-vink { display: grid; place-items: center; width: 34px; height: 36px; border: 1px solid var(--lijn); border-radius: 8px; background: var(--paneel); }
.juist-vink input { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }
.juist-vink:has(input:checked) { border-color: var(--accent); background: var(--accent-zacht); }

/* opgemaakte tekst */
.rijk-veld { border: 1px solid var(--lijn); border-radius: 8px; background: var(--paneel); }
.rijk-veld:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-zacht); }
.rijk-balk { display: flex; gap: 2px; padding: 4px; border-bottom: 1px solid var(--lijn); flex-wrap: wrap; }
.rijk-balk button { min-width: 30px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--tekst-2); font-size: 12.5px; font-weight: 700; padding: 0 7px; }
.rijk-balk button:hover { background: var(--vlak); color: var(--tekst); }
.rijk { min-height: 90px; padding: 10px 12px; font-size: 14px; line-height: 1.6; outline: none; overflow-wrap: anywhere; }
.rijk:empty::before { content: attr(data-leeg); color: var(--tekst-3); }
.rijk p { margin: 0 0 0.6em; }
.rijk h3 { font-size: 15px; margin: 0.6em 0 0.3em; }
.rijk ul, .rijk ol { margin: 0 0 0.6em; padding-left: 1.3em; }
.rijk a { color: var(--accent-sterk); }
.linkregel { display: flex; gap: 6px; padding: 6px; border-top: 1px solid var(--lijn); }

.beeld-kies { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; align-items: center; }
.beeld-kies .duim { width: 120px; height: 80px; border-radius: 8px; border: 1px dashed var(--lijn); background: var(--vlak) center / contain no-repeat; display: grid; place-items: center; font-size: 11px; color: var(--tekst-3); text-align: center; }
.herkend { font-size: 12px; color: var(--accent-sterk); background: var(--accent-zacht); border-radius: 6px; padding: 6px 9px; }
.herkend.niet { color: var(--waarschuwing); background: var(--waarschuwing-zacht); }

/* ---------------------------------------------------------------- voorbeeld */
.voorbeeld-balk { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--lijn); background: var(--paneel); flex-wrap: wrap; }
.voorbeeld-balk .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--tekst-2); font-weight: 700; margin-right: auto; }
.segment-keuze { display: inline-flex; border: 1px solid var(--lijn); border-radius: 8px; overflow: hidden; }
.segment-keuze button { border: 0; background: var(--paneel); padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--tekst-2); }
.segment-keuze button[aria-pressed="true"] { background: var(--accent-zacht); color: var(--accent-sterk); }
.voorbeeld-veld { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; padding: 14px; }
.voorbeeld-scherm { width: 100%; height: 100%; overflow: auto; border-radius: 10px; border: 1px solid var(--lijn); background: #F7F4F0; }
.voorbeeld-scherm.telefoon { width: 390px; max-width: 100%; border-radius: 22px; border-width: 6px; border-color: var(--tekst-3); }

/* ---------------------------------------------------------------- dialogen */
.dialoog-achter { position: fixed; inset: 0; background: rgba(10, 20, 15, 0.45); z-index: 50; display: grid; place-items: center; padding: 16px; }
.dialoog { width: min(640px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--paneel); border-radius: 14px; box-shadow: var(--schaduw); padding: 22px; display: grid; gap: 14px; border: 1px solid var(--lijn); }
.dialoog h2 { font-size: 19px; }
.dialoog p { margin: 0; color: var(--tekst-2); line-height: 1.55; }
.dialoog .voet { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dialoog .voortgang { font-size: 12.5px; color: var(--tekst-2); background: var(--vlak); border-radius: 8px; padding: 10px 12px; }
.dialoog .fout { color: var(--gevaar); background: var(--gevaar-zacht); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.keuzelijst { display: grid; gap: 8px; }
.keuzelijst button { text-align: left; display: grid; gap: 3px; padding: 12px 14px; border: 1px solid var(--lijn); border-radius: 10px; background: var(--paneel); }
.keuzelijst button:hover { border-color: var(--accent); background: var(--accent-zacht); }
.keuzelijst strong { font-size: 14px; }
.keuzelijst small { font-size: 12px; color: var(--tekst-2); line-height: 1.45; }

.melding { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--tekst); color: var(--paneel); padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: var(--schaduw); max-width: calc(100% - 32px); }
.bevestig { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--gevaar); }

/* ---------------------------------------------------------------- smal */
@media (max-width: 1180px) {
  .werk { grid-template-columns: 250px minmax(0, 1fr); }
  .werk[data-tab="voorbeeld"] .baan-editor { display: none; }
  .werk:not([data-tab="voorbeeld"]) .baan-voorbeeld { display: none; }
  .werk .baan-voorbeeld { border-left: 0; }
  .segment-keuze.tabs-smal { display: inline-flex; }
}
@media (max-width: 760px) {
  .werk { grid-template-columns: minmax(0, 1fr); }
  .tabs-smal .alleen-mobiel { display: inline-block; }
  .werk .baan-structuur { display: none; border-right: 0; }
  .werk[data-tab="structuur"] .baan-structuur { display: block; }
  .werk[data-tab="structuur"] .baan-editor { display: none; }
  .bovenbalk { gap: 6px 10px; }
  .bovenbalk .acties { margin-left: 0; width: 100%; flex-wrap: nowrap; }
  .bovenbalk .acties .tabs-smal { flex: 1 1 auto; }
  .bovenbalk .acties .tabs-smal button { flex: 1 1 0; padding-inline: 6px; }
  #knop-openen { padding-inline: 10px; }
  .cursuskeuze { flex: 1 1 0; max-width: none; }
  .status { order: 4; width: 100%; font-size: 11px; }
  .twee, .reeks-rij.drie { grid-template-columns: minmax(0, 1fr); }
  .beeld-kies { grid-template-columns: minmax(0, 1fr); }
  .merk-naam { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">

<script type="text/plain" id="speler-css">/* Eigen e-learningspeler, in het Green Office-palet uit de Flutter-app
   (lib/theme.dart, GOColors). Warm off-white met saliegroen. */

.cursus {
  --lees: 42rem;

  --go-bg: #F7F4F0;
  --go-kaart: #FFFFFF;
  --go-vlak: #F2EEE9;

  --go-rand: #E4DDD6;
  --go-rand-zacht: #EDE8E3;
  --go-schaduw: 0 2px 12px rgba(0, 0, 0, 0.08);

  --go-tekst: #1C1713;
  --go-tekst-2: #7A6E66;
  --go-tekst-3: #6B5D52;
  --go-gedimd: #B0A49A;

  --go-groen: #5C7A5A;
  --go-groen-donker: #4A6349;
  --go-groen-licht: #EDF3EC;
  --go-groen-medium: #D0E3CF;

  --go-warm-tekst: #7D6034;
  --go-warm-licht: #F6F0E8;
  --go-rood: #C0392B;
  --go-rood-licht: #FBEDEA;

  --r-kaart: 14px;
  --r-knop: 10px;

  /* Eén binnenmaat voor alle kaarten en één inspringing voor lijsten, citaten
     en de tijdlijn, zodat tekst in verschillende blokken op dezelfde lijn begint. */
  --binnen: 1.5rem;
  --inspring: 1.4rem;
}

/* De speler tekent in een element met class cursus, niet in body. */
.cursus {
  min-height: 100%;
  background: var(--go-bg);
  color: var(--go-tekst);
  margin: 0;
  font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* Eén gedeelde kolom: hero, modulelijst, leesbalk en tekst lijnen precies uit. */
.hero-inner,
.modules,
.lezer,
.leesbalk-inner {
  max-width: calc(var(--lees) + 3rem);
  margin-left: auto;
  margin-right: auto;
  padding-left: 1.5rem;
  padding-right: 1.5rem;
}

/* ============================ startpagina ============================ */

.hero {
  background: var(--go-groen);
  color: #fff;
  padding: 4.5rem 0 4rem;
}

.hero .kicker {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.7);
  margin: 0 0 0.9rem;
}

.hero h1 {
  margin: 0 0 0.75rem;
  font-size: clamp(2rem, 5vw, 2.9rem);
  line-height: 1.12;
  letter-spacing: -0.02em;
  font-weight: 600;
}

.hero .sub {
  margin: 0 0 1.75rem;
  font-size: 1.05rem;
  line-height: 1.55;
  color: rgba(255, 255, 255, 0.82);
}

.hero .auteur {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin: 0 0 2.25rem;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.75);
}

.hero .auteur .bol {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
  display: grid; place-items: center;
  font-size: 0.72rem; font-weight: 600;
}

.hero .btn-groot {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  background: #fff;
  color: var(--go-groen-donker);
  border: none;
  font-family: inherit;
  font-size: 0.92rem;
  font-weight: 600;
  padding: 0.85rem 1.6rem;
  border-radius: var(--r-knop);
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
}
.hero .btn-groot:hover { background: var(--go-groen-licht); }
.hero .btn-groot:active { transform: translateY(1px); }

.hero .voortgangsbalk { margin-top: 1.75rem; max-width: 24rem; }

.hero .voortgangsbalk .spoor {
  height: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.22);
  overflow: hidden;
}
.hero .voortgangsbalk .vulling {
  height: 100%;
  background: #fff;
  border-radius: 3px;
  transition: width 0.4s ease;
}
.hero .voortgangsbalk .tekst {
  margin-top: 0.55rem;
  font-size: 0.78rem;
  color: rgba(255, 255, 255, 0.75);
}

/* modulelijst */

.modules { padding-top: 2.75rem; padding-bottom: 5rem; }

.module-kaart {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 1.1rem;
  width: 100%;
  text-align: left;
  background: var(--go-kaart);
  border: 1px solid var(--go-rand);
  border-radius: var(--r-kaart);
  box-shadow: var(--go-schaduw);
  padding: 1.2rem 1.4rem;
  margin-bottom: 0.75rem;
  font-family: inherit;
  color: inherit;
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.1s ease;
}
.module-kaart:hover { border-color: var(--go-groen); }
.module-kaart:active { transform: translateY(1px); }

.module-kaart .nummer {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 0.82rem; font-weight: 600;
  background: var(--go-vlak);
  color: var(--go-tekst-2);
}
.module-kaart.af .nummer { background: var(--go-groen); color: #fff; }
.module-kaart.bezig .nummer { background: var(--go-groen-medium); color: var(--go-groen-donker); }

.module-kaart h2 {
  margin: 0;
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.35;
  color: var(--go-tekst);
}

.module-kaart .regel {
  margin-top: 0.4rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
  font-size: 0.78rem;
  color: var(--go-tekst-2);
}

.deadline {
  display: inline-block;
  padding: 0.16rem 0.5rem;
  border-radius: 6px;
  background: var(--go-warm-licht);
  color: var(--go-warm-tekst);
  font-weight: 600;
  font-size: 0.72rem;
}

.module-kaart .pijl { color: var(--go-gedimd); font-size: 1.1rem; line-height: 1; }
.module-kaart:hover .pijl { color: var(--go-groen); }

.mini-spoor {
  width: 56px; height: 4px;
  border-radius: 2px;
  background: var(--go-rand);
  overflow: hidden;
}
.mini-spoor i { display: block; height: 100%; background: var(--go-groen); }

/* ============================ modulepagina ============================ */

.leesbalk {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(247, 244, 240, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--go-rand-zacht);
}

.leesbalk-inner {
  height: 56px;
  display: flex;
  align-items: center;
  gap: 1rem;
}

.leesbalk .terug {
  background: none; border: none; padding: 0;
  font-family: inherit; font-size: 0.85rem; font-weight: 500;
  color: var(--go-tekst-2); cursor: pointer; white-space: nowrap;
}
.leesbalk .terug:hover { color: var(--go-groen); }

.leesbalk .naam {
  flex: 1;
  font-size: 0.85rem;
  font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.leesbalk .teller { font-size: 0.78rem; color: var(--go-tekst-2); white-space: nowrap; }

.leesbalk .spoor { height: 3px; background: var(--go-rand-zacht); }
.leesbalk .spoor i {
  display: block; height: 100%;
  background: var(--go-groen);
  transition: width 0.35s ease;
}

.lezer { padding-top: 3rem; padding-bottom: 6rem; }

.moduletitel {
  margin: 0 0 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--go-rand);
}
.moduletitel .kicker {
  font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--go-groen); margin: 0 0 0.6rem;
}
.moduletitel h1 {
  margin: 0;
  font-size: clamp(1.6rem, 4vw, 2.1rem);
  line-height: 1.18;
  letter-spacing: -0.015em;
  font-weight: 600;
}

/* segmenten */

.segment { animation: opkomen 0.4s ease both; }

@keyframes opkomen {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .segment { animation: none; }
}

.blok { margin: 0 0 1.75rem; }

.blok h2 {
  margin: 2.5rem 0 0.9rem;
  font-size: 1.3rem;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--go-tekst);
}
.segment:first-child .blok:first-child h2 { margin-top: 0; }

.blok p, .blok li {
  font-size: 1.02rem;
  line-height: 1.75;
  color: var(--go-tekst);
}
.blok p { margin: 0 0 1.1rem; }
/* Vangnet voor tekst die zonder <p> binnenkomt. */
.blok > div { font-size: 1.02rem; line-height: 1.75; }
.blok ul, .blok ol { margin: 0 0 1.1rem; padding-left: var(--inspring); }
.blok li { margin-bottom: 0.45rem; }
.blok li p { margin: 0; }
.blok li::marker { color: var(--go-groen); }
.blok strong { font-weight: 600; }
.blok em { color: var(--go-tekst-3); }
.blok a { color: var(--go-groen); }

.blok h3, .blok h4 {
  margin: 1.75rem 0 0.6rem;
  font-size: 1.06rem;
  font-weight: 600;
}

figure.beeld { margin: 2rem 0; }
figure.beeld img {
  width: 100%; height: auto; display: block;
  margin: 0 auto;
  border-radius: var(--r-kaart);
  background: var(--go-vlak);
}
figure.beeld figcaption {
  margin-top: 0.6rem;
  font-size: 0.8rem;
  color: var(--go-tekst-2);
  text-align: center;
  line-height: 1.55;
}
figure.beeld figcaption a { color: var(--go-groen-donker); }

.video {
  margin: 2rem 0;
  border-radius: var(--r-kaart);
  overflow: hidden;
  background: #000;
  aspect-ratio: 16 / 9;
}
.video iframe { width: 100%; height: 100%; border: 0; display: block; }
.video-titel { margin-top: 0.55rem; font-size: 0.8rem; color: var(--go-tekst-2); }

/* tabbladen */

.tabs {
  margin: 2rem 0;
  background: var(--go-kaart);
  border: 1px solid var(--go-rand);
  border-radius: var(--r-kaart);
  overflow: hidden;
}
/* De knoppen lopen door op een volgende regel in plaats van onzichtbaar opzij
   te scrollen: anders zag je bij lange namen maar één tabblad. De tekst van de
   eerste knop lijnt uit met de inhoud eronder. */
.tab-knoppen {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  padding: 0.5rem calc(var(--binnen) - 0.75rem - 1px);
  background: var(--go-vlak);
  border-bottom: 1px solid var(--go-rand);
}

.tab-knoppen button {
  background: none;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 0.5rem 0.75rem;
  font-family: inherit; font-size: 0.86rem; font-weight: 500;
  line-height: 1.35;
  text-align: left;
  color: var(--go-tekst-2); cursor: pointer;
}
.tab-knoppen button:hover { color: var(--go-tekst); }
.tab-knoppen button:focus-visible { outline: 2px solid var(--go-groen); outline-offset: 1px; }
.tab-knoppen button[aria-selected="true"] {
  background: var(--go-kaart);
  border-color: var(--go-rand);
  color: var(--go-groen);
  font-weight: 600;
}
.tab-inhoud { padding: var(--binnen); }
.tab-inhoud ul, .tab-inhoud ol,
.accordeon-inhoud ul, .accordeon-inhoud ol { margin: 0 0 0.9rem; padding-left: var(--inspring); }
.tab-inhoud li, .accordeon-inhoud li { font-size: 1rem; line-height: 1.72; margin-bottom: 0.4rem; }
.tab-inhoud li p, .accordeon-inhoud li p { margin: 0; }
.tab-inhoud li::marker, .accordeon-inhoud li::marker { color: var(--go-groen); }
.tab-inhoud > :last-child, .accordeon-inhoud > :last-child { margin-bottom: 0; }
.tab-inhoud p { font-size: 1rem; line-height: 1.72; margin: 0 0 0.9rem; }
.tab-inhoud > :first-child, .accordeon-inhoud > :first-child { margin-top: 0; }

/* kennisvragen */

.vraag {
  margin: 2.25rem 0;
  background: var(--go-kaart);
  border: 1px solid var(--go-rand);
  border-radius: var(--r-kaart);
  box-shadow: var(--go-schaduw);
  padding: var(--binnen);
}

.vraag .label {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--go-groen);
  margin-bottom: 0.7rem;
}

/* De vraagtekst komt soms als losse tekst en soms in alinea's binnen. */
.vraag .stelling {
  margin: 0 0 1.2rem;
  font-size: 1.02rem; line-height: 1.6; font-weight: 600;
  color: var(--go-tekst);
}
.vraag .stelling p { margin: 0 0 0.6rem; }
.vraag .stelling p:last-child { margin-bottom: 0; }

.opties { display: grid; gap: 0.5rem; }

.optie {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.85rem 1rem;
  border: 1px solid var(--go-rand);
  border-radius: var(--r-knop);
  cursor: pointer;
  font-size: 0.95rem;
  line-height: 1.5;
  background: var(--go-kaart);
  transition: border-color 0.12s ease, background 0.12s ease;
  text-align: left;
  font-family: inherit;
  color: var(--go-tekst);
  width: 100%;
}
.optie:hover:not(:disabled) { border-color: var(--go-groen); background: var(--go-groen-licht); }
.optie:disabled { cursor: default; }

.optie .vink {
  flex: 0 0 auto;
  width: 19px; height: 19px;
  border: 1.5px solid var(--go-rand);
  border-radius: 50%;
  margin-top: 0.12rem;
  display: grid; place-items: center;
  font-size: 0.62rem;
  color: transparent;
  background: var(--go-kaart);
}
.optie[data-multi="1"] .vink { border-radius: 5px; }
.optie[aria-pressed="true"] .vink {
  border-color: var(--go-groen);
  background: var(--go-groen);
  color: #fff;
}

.optie.goed { border-color: var(--go-groen); background: var(--go-groen-licht); }
.optie.goed .vink { border-color: var(--go-groen); background: var(--go-groen); color: #fff; }
.optie.fout { border-color: var(--go-rood); background: var(--go-rood-licht); }
.optie.fout .vink { border-color: var(--go-rood); background: var(--go-rood); color: #fff; }

.vraag-acties { margin-top: 1.2rem; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }

.knop-klein {
  font-family: inherit;
  font-size: 0.85rem; font-weight: 600;
  padding: 0.65rem 1.25rem;
  border-radius: var(--r-knop);
  border: 1px solid var(--go-groen);
  background: var(--go-groen);
  color: #fff;
  cursor: pointer;
  transition: background 0.15s ease;
}
.knop-klein:hover:not(:disabled) { background: var(--go-groen-donker); border-color: var(--go-groen-donker); }
.knop-klein:disabled { opacity: 0.45; cursor: default; }
.knop-klein.stil { background: transparent; color: var(--go-tekst-2); border-color: var(--go-rand); }
.knop-klein.stil:hover { border-color: var(--go-groen); color: var(--go-groen); background: transparent; }

.uitslag {
  margin-top: 1.1rem;
  padding: 0.9rem 1rem;
  border-radius: var(--r-knop);
  font-size: 0.92rem;
  line-height: 1.55;
}
.uitslag.goed { background: var(--go-groen-licht); color: var(--go-groen-donker); }
.uitslag.fout { background: var(--go-rood-licht); color: var(--go-rood); }

/* koppelvraag en sorteeropdracht */

.omschrijvingen {
  list-style: none;
  margin: 0 0 1.4rem;
  padding: 0;
  display: grid;
  gap: 0.45rem;
}
.omschrijvingen li {
  display: grid;
  grid-template-columns: 1.75rem 1fr;
  gap: 0.75rem;
  align-items: start;
  padding: 0.7rem 1rem;
  border: 1px solid transparent;
  border-radius: var(--r-knop);
  background: var(--go-vlak);
  font-size: 0.92rem;
  line-height: 1.55;
}
.letter {
  width: 1.75rem; height: 1.75rem;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--go-kaart);
  border: 1px solid var(--go-rand);
  color: var(--go-groen-donker);
  font-size: 0.78rem; font-weight: 600;
  line-height: 1;
}
.omschrijvingen li > span:last-child { padding-top: 0.12rem; }

.keuzerijen { display: grid; gap: 0.6rem; }
.keuzerij {
  padding: 0.85rem 1rem;
  border: 1px solid var(--go-rand);
  border-radius: var(--r-knop);
  background: var(--go-kaart);
  transition: border-color 0.12s ease, background 0.12s ease;
}
.keuzerij-tekst {
  font-weight: 600;
  font-size: 0.95rem;
  line-height: 1.45;
  margin-bottom: 0.65rem;
}
.keuzeknoppen { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.keuzeknop {
  font-family: inherit;
  font-size: 0.84rem; font-weight: 500;
  line-height: 1.35;
  text-align: left;
  padding: 0.5rem 0.8rem;
  border: 1px solid var(--go-rand);
  border-radius: 8px;
  background: var(--go-kaart);
  color: var(--go-tekst);
  cursor: pointer;
  transition: border-color 0.12s ease, background 0.12s ease;
}
.met-letters .keuzeknop {
  width: 2.4rem; height: 2.4rem;
  padding: 0;
  text-align: center;
  font-weight: 600;
}
.keuzeknop:hover:not(:disabled) { border-color: var(--go-groen); background: var(--go-groen-licht); }
.keuzeknop:focus-visible { outline: 2px solid var(--go-groen); outline-offset: 2px; }
.keuzeknop[aria-pressed="true"] { border-color: var(--go-groen); background: var(--go-groen); color: #fff; }
.keuzeknop:disabled { cursor: default; }
.keuzeknop:disabled:not([aria-pressed="true"]) { opacity: 0.45; }

.keuzerij-gekozen:empty { display: none; }
.keuzerij-gekozen {
  margin-top: 0.6rem;
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--go-tekst-3);
}
.keuzerij-correctie {
  margin-top: 0.6rem;
  padding-top: 0.6rem;
  border-top: 1px solid var(--go-rood-licht);
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--go-groen-donker);
}

/* Met letters past het begrip naast de knoppen; de knoppen vormen zo een
   rechte kolom. Daaronder de gekozen omschrijving en een eventuele correctie. */
.met-letters .keuzerij {
  display: grid;
  grid-template-columns: 1fr auto;
  column-gap: 1rem;
  align-items: center;
}
.met-letters .keuzerij-tekst { margin-bottom: 0; }
.met-letters .keuzerij-gekozen,
.met-letters .keuzerij-correctie { grid-column: 1 / -1; }

@media (max-width: 640px) {
  .met-letters .keuzerij { grid-template-columns: 1fr; }
  .met-letters .keuzerij-tekst { margin-bottom: 0.65rem; }
}

.keuzerij.goed { border-color: var(--go-groen); background: var(--go-groen-licht); }
.keuzerij.fout { border-color: var(--go-rood); background: var(--go-rood-licht); }
.keuzerij.fout .keuzeknop[aria-pressed="true"] { border-color: var(--go-rood); background: var(--go-rood); }
.keuzerij.fout .keuzerij-correctie { border-top-color: rgba(192, 57, 43, 0.25); }

/* doorgaan-knop */

.doorgaan {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.65rem;
  margin: 2.5rem 0 1rem;
  padding-top: 2.5rem;
  border-top: 1px solid var(--go-rand);
}

.doorgaan button {
  font-family: inherit;
  font-size: 0.92rem; font-weight: 600;
  padding: 0.85rem 2.1rem;
  border-radius: var(--r-knop);
  border: none;
  background: var(--go-groen);
  color: #fff;
  cursor: pointer;
  transition: background 0.15s ease;
}
.doorgaan button:hover:not(:disabled) { background: var(--go-groen-donker); }
.doorgaan button:disabled { background: var(--go-rand); color: var(--go-tekst-2); cursor: default; }

.doorgaan .hint { font-size: 0.82rem; color: var(--go-tekst-2); }

/* afronding */

.afronding {
  margin-top: 3rem;
  padding: 2.75rem 1.75rem;
  background: var(--go-kaart);
  border: 1px solid var(--go-rand);
  border-radius: var(--r-kaart);
  box-shadow: var(--go-schaduw);
  text-align: center;
}
.afronding .vinkje {
  width: 52px; height: 52px;
  margin: 0 auto 1.1rem;
  border-radius: 50%;
  background: var(--go-groen);
  color: #fff;
  display: grid; place-items: center;
  font-size: 1.5rem;
}
.afronding h2 { margin: 0 0 0.5rem; font-size: 1.25rem; font-weight: 600; }
.afronding p { margin: 0 0 1.6rem; color: var(--go-tekst-2); font-size: 0.95rem; line-height: 1.6; }
.afronding .knoppen { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }

@media (max-width: 640px) {
  .cursus { --binnen: 1.15rem; }
  .hero { padding: 3rem 0; }
  .hero-inner, .modules, .lezer, .leesbalk-inner { padding-left: 1.25rem; padding-right: 1.25rem; }
  .modules { padding-bottom: 4rem; }
  .lezer { padding-top: 2rem; padding-bottom: 4rem; }
  .module-kaart { grid-template-columns: auto 1fr; }
  .module-kaart .pijl { display: none; }
}

/* schema's */

figure.schema { margin: 2.25rem 0; }

.schema-vlak {
  background: var(--go-kaart);
  border: 1px solid var(--go-rand);
  border-radius: var(--r-kaart);
  padding: var(--binnen);
  overflow-x: auto;
}

.schema-vlak svg {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
  font-family: inherit;
}

figure.schema figcaption {
  margin-top: 0.7rem;
  font-size: 0.82rem;
  line-height: 1.55;
  color: var(--go-tekst-2);
}

/* uitklapblokken */

.accordeon {
  margin: 2rem 0;
  background: var(--go-kaart);
  border: 1px solid var(--go-rand);
  border-radius: var(--r-kaart);
  overflow: hidden;
}
.accordeon details + details { border-top: 1px solid var(--go-rand); }
.accordeon summary {
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 1rem var(--binnen);
  font-weight: 600;
  font-size: 0.98rem;
  cursor: pointer;
}
.accordeon summary::-webkit-details-marker { display: none; }
.accordeon summary::after {
  content: '+';
  flex: 0 0 auto;
  font-size: 1.2rem; font-weight: 400; line-height: 1;
  color: var(--go-groen);
}
.accordeon details[open] summary::after { content: '−'; }
.accordeon summary:hover { color: var(--go-groen); }
.accordeon-inhoud { padding: 0 var(--binnen) 1.2rem; }
.accordeon-inhoud p { font-size: 1rem; line-height: 1.72; margin: 0 0 0.9rem; }
.accordeon-inhoud p:last-child { margin-bottom: 0; }

/* begrippenkaartjes */

.kaartjes-blok { margin: 2rem 0; }
.kaartjes-hint { font-size: 0.8rem; color: var(--go-tekst-2); margin-bottom: 0.7rem; }
.kaartjes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
  gap: 0.75rem;
}
.kaartje {
  display: grid;
  min-height: 9rem;
  background: var(--go-kaart);
  border: 1px solid var(--go-rand);
  border-radius: var(--r-kaart);
  box-shadow: var(--go-schaduw);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.kaartje:hover { border-color: var(--go-groen); }
.kaartje:focus-visible { outline: 2px solid var(--go-groen); outline-offset: 2px; }
.kaartje > div {
  grid-area: 1 / 1;
  display: flex; align-items: center; justify-content: center;
  padding: 1.1rem;
  text-align: center;
  transition: opacity 0.2s ease;
}
.kaartje p { margin: 0; }
.kaartje .voorkant { font-weight: 600; font-size: 1rem; }
.kaartje .achterkant { font-size: 0.88rem; line-height: 1.55; opacity: 0; visibility: hidden; }
.kaartje[aria-pressed="true"] { background: var(--go-groen-licht); border-color: var(--go-groen-medium); }
.kaartje[aria-pressed="true"] .voorkant { opacity: 0; visibility: hidden; }
.kaartje[aria-pressed="true"] .achterkant { opacity: 1; visibility: visible; }

/* statement */

blockquote.statement {
  margin: 2.5rem 0;
  padding: 0.4rem 0 0.4rem calc(var(--inspring) - 3px);
  border-left: 3px solid var(--go-groen);
  font-size: 1.25rem;
  line-height: 1.5;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--go-groen-donker);
}
blockquote.statement p { margin: 0; }

/* externe links */

.linkjes { margin: 1.5rem 0; display: flex; flex-wrap: wrap; gap: 0.6rem; }
.linkknop {
  display: inline-flex; align-items: center; gap: 0.45rem;
  padding: 0.7rem 1.15rem;
  border: 1px solid var(--go-groen);
  border-radius: var(--r-knop);
  background: var(--go-kaart);
  color: var(--go-groen-donker);
  font-size: 0.88rem; font-weight: 600;
  text-decoration: none;
  transition: background 0.15s ease;
}
.linkknop:hover { background: var(--go-groen-licht); }
.linkknop .pijltje { font-size: 0.85rem; }

/* tijdlijn */

.tijdlijn {
  list-style: none;
  margin: 2rem 0;
  padding: 0 0 0 calc(var(--inspring) - 2px);
  border-left: 2px solid var(--go-groen-medium);
}
.tijdlijn li { position: relative; margin: 0 0 1.6rem; }
.tijdlijn li:last-child { margin-bottom: 0; }
.tijdlijn li::before {
  content: '';
  position: absolute;
  left: calc(-1 * var(--inspring) - 7px);
  top: 0.3rem;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--go-groen);
  border: 2px solid var(--go-bg);
}
.tijdlijn-label {
  font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--go-groen);
  margin-bottom: 0.25rem;
}
.tijdlijn h3 { margin: 0 0 0.35rem; font-size: 1.02rem; font-weight: 600; }
.tijdlijn p { margin: 0; font-size: 0.97rem; line-height: 1.68; }

/* stappenplan */

.stappenplan {
  margin: 2.25rem 0;
  background: var(--go-kaart);
  border: 1px solid var(--go-rand);
  border-radius: var(--r-kaart);
  box-shadow: var(--go-schaduw);
  padding: var(--binnen);
}
.stappenplan .label {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--go-groen);
  margin-bottom: 0.7rem;
}
.stappenplan h3 { margin: 0 0 0.5rem; font-size: 1.06rem; font-weight: 600; }
.stappenplan > p { margin: 0 0 1.3rem; font-size: 0.97rem; line-height: 1.68; }
.stappen { list-style: none; counter-reset: stap; margin: 0; padding: 0; }
.stappen li {
  counter-increment: stap;
  position: relative;
  padding: 0 0 1rem 2.6rem;
}
.stappen li::before {
  content: counter(stap);
  position: absolute; left: 0; top: 0;
  width: 1.8rem; height: 1.8rem;
  border-radius: 50%;
  background: var(--go-groen-licht);
  color: var(--go-groen-donker);
  display: grid; place-items: center;
  font-size: 0.8rem; font-weight: 600;
}
.stappen strong { display: block; font-size: 0.97rem; line-height: 1.8rem; }
.stappen p { margin: 0.1rem 0 0; font-size: 0.93rem; line-height: 1.6; color: var(--go-tekst-3); }
.stappen-slot {
  margin-top: 0.4rem;
  padding: 1rem;
  border-radius: var(--r-knop);
  background: var(--go-vlak);
}
.stappen-slot strong { display: block; font-size: 0.92rem; margin-bottom: 0.3rem; }
.stappen-slot p { margin: 0; font-size: 0.92rem; line-height: 1.6; }

/* uitleg per antwoordoptie */

.optie-uitleg {
  display: block;
  margin-top: 0.45rem;
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--go-tekst-3);
}

@media (max-width: 640px) {
}

/* video op een externe site */

.video-extern {
  display: flex; align-items: center; gap: 1rem;
  margin: 2rem 0;
  padding: 1.1rem var(--binnen);
  background: var(--go-kaart);
  border: 1px solid var(--go-rand);
  border-radius: var(--r-kaart);
  box-shadow: var(--go-schaduw);
  color: var(--go-tekst);
  text-decoration: none;
  transition: border-color 0.15s ease;
}
.video-extern:hover { border-color: var(--go-groen); }
.video-extern .speel {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--go-groen);
  color: #fff;
  display: grid; place-items: center;
  font-size: 0.9rem;
  padding-left: 3px; box-sizing: border-box;
}
.video-extern strong { display: block; font-size: 0.95rem; font-weight: 600; line-height: 1.4; }
.video-extern .bron { display: block; margin-top: 0.2rem; font-size: 0.8rem; color: var(--go-groen-donker); }

@media (max-width: 640px) {
  .kaartje { min-height: 6.5rem; }
}

/* ============================ aanvullingen voor de bouwer ============================ */

.modules .intro { margin: 0 0 1.75rem; color: var(--go-tekst-2); font-size: 0.9rem; line-height: 1.65; }
.moduletitel .deadline-regel { margin: 0.9rem 0 0; }
.lezer .leeg { color: var(--go-tekst-2); font-style: italic; }

/* ingesloten inhoud van andere sites */
figure.insluiting { margin: 2rem 0; }
.insluiting-kader {
  border: 1px solid var(--go-rand);
  border-radius: var(--r-kaart);
  overflow: hidden;
  background: var(--go-kaart);
  max-height: 85vh;
}
.insluiting-kader iframe { width: 100%; height: 100%; border: 0; display: block; }
figure.insluiting figcaption { margin-top: 0.55rem; font-size: 0.8rem; color: var(--go-tekst-2); }
figure.insluiting figcaption a { color: var(--go-groen-donker); }

/* plaatshouder in het voorbeeld van de bouwer */
.extern-voorbeeld {
  display: flex; align-items: center; gap: 1rem;
  margin: 2rem 0;
  padding: 1.1rem var(--binnen);
  background: var(--go-kaart);
  border: 1px dashed var(--go-gedimd);
  border-radius: var(--r-kaart);
  color: var(--go-tekst);
}
.extern-voorbeeld .speel {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--go-groen-licht);
  color: var(--go-groen-donker);
  display: grid; place-items: center;
  font-size: 1rem;
}
.extern-voorbeeld strong { display: block; font-size: 0.95rem; font-weight: 600; line-height: 1.4; }
.extern-voorbeeld .bron { display: block; margin-top: 0.2rem; font-size: 0.8rem; color: var(--go-tekst-2); }

<script type="application/json" id="voorbeeld-cursus">{"id":"voorbeeld-duurzaamheid","title":"Duurzaamheid en systeemdenken (voorbeeld)","subtitle":"Twee ingekorte modules uit de minor Circulaire Economie","author":"Fabian Berndsen","intro":"Dit is een voorbeeldcursus om de bouwer te leren kennen. Pas hem aan, of begin met een nieuwe e-learning via Nieuw.","voorbeeld":true,"lessons":[{"id":"m1","title":"Systeemdenken en de drie dimensies","deadline":"","blocks":[{"t":"text","heading":"Waarom Systeemdenken de Sleutel is tot Duurzaamheid","body":"\u003cp>Duurzaamheid is geen kwestie van één enkel probleem oplossen, maar van het begrijpen en beïnvloeden van complexe systemen waarin ecologische, sociale en economische factoren continu met elkaar in wisselwerking staan. Wanneer we alleen losse onderdelen behandelen, missen we vaak de onderliggende dynamiek — en ontstaan er soms onverwachte consequenties.\u003c/p>\u003cp>Met \u003cstrong>\u003cu>systeemdenken\u003c/u>\u003c/strong>\u003cu> \u003c/u>benaderen we vraagstukken niet als geïsoleerde incidenten, maar zien we ze als onderdeel van een groter geheel. We kijken naar patronen, terugkoppelingen en structuren die de gebeurtenissen onder het oppervlak bepalen. Daarmee vergroten we onze kans op oplossingen die echt duurzaam zijn — niet alleen voor nu, maar ook voor de toekomst.\u003c/p>\u003cp>Een belangrijk kader om duurzaamheid breder te begrijpen, zijn de \u003cstrong>\u003cu>Sustainable Development Goals (SDG’s)\u003c/u>\u003c/strong> van de Verenigde Naties. Deze zeventien doelen benadrukken dat milieu, maatschappij en economie onlosmakelijk met elkaar verbonden zijn. Duurzame ontwikkeling betekent dat we rekening houden met de grenzen van de natuur, maar ook met welzijn, gelijkheid en economische stabiliteit.\u003cbr>Bekijk de doelen op de officiële VN-pagina: \u003ca rel=\"noopener noreferrer nofollow\" target=\"_blank\" href=\"https://sdgs.un.org/goals\">https://sdgs.un.org/goals\u003c/a>\u003c/p>\u003cp>Voor een korte, toegankelijke uitleg van systeemdenken in beeld , bekijk de video hieronder &nbsp;\u003cem>\"Systems Thinking: A Cautionary Tale\"\u003c/em> (2 minuten)(AANRADER!) \u003c/p>\u003cp>Een andere heldere visuele uitleg over de kern van duurzaamheid is te vinden in de video \u003cem>\"What is Sustainability?\"\u003c/em> (BBC Ideas)\u003c/p>\u003cp>Door systeemdenken te integreren in ons denken over duurzaamheid leren we verder kijken dan symptomen of afzonderlijke maatregelen. We zien hoe keuzes op het ene vlak doorwerken in andere domeinen en hoe samenwerking, beleid en innovatie samen een duurzame toekomst vormgeven.\u003c/p>\u003cp>In de volgende onderdelen van deze module onderzoeken we stap voor stap hoe duurzaamheid wordt opgebouwd uit drie dimensies — ecologisch, economisch en sociaal — en hoe systeemdenken ons helpt om die samenhang beter te begrijpen.\u003c/p>"},{"t":"video","youtube":"zx04Kl8y4dE","title":"What is Sustainability"},{"t":"list","ordered":true,"items":["\u003cp>Je legt uit wat systeemdenken is en waarom het belangrijk is voor duurzaamheid.\u003c/p>","\u003cp>Je herkent de drie dimensies van duurzaamheid: ecologisch, economisch en sociaal.\u003c/p>","\u003cp>Je beschrijft hoe deze systemen met elkaar verbonden zijn.\u003c/p>","\u003cp>Je maakt kennis met de Sustainable Development Goals (SDG’s) als internationaal kompas.\u003c/p>"]},{"t":"continue"},{"t":"text","heading":"Belangrijke Begrippen","body":"\u003cp>Deze begrippen vormen de basis voor de rest van de cursus. Door ze goed te begrijpen, leg je een stevig fundament voor het toepassen van systeemdenken en het werken aan duurzaamheid. Gebruik deze flashcards om jezelf te testen en de kernconcepten te onthouden.\u003c/p>"},{"t":"cards","items":[{"front":"\u003cp>Systeemdenken\u003c/p>","back":"\u003cp>Een manier van kijken waarbij je let op samenhang, interacties en patronen binnen en tussen systemen, in plaats van op losse onderdelen.\u003c/p>"},{"front":"\u003cp>Duurzaamheid\u003c/p>","back":"\u003cp>Het streven naar een balans tussen ecologische, economische en sociale belangen, zodat zowel huidige als toekomstige generaties kunnen voorzien in hun behoeften en welvaart.\u003c/p>"},{"front":"\u003cp>Triple Bottom Line\u003c/p>","back":"\u003cp>Een benadering waarbij organisaties hun prestaties meten op drie vlakken: people (sociaal), planet (ecologisch) en profit (economisch), met aandacht voor zowel het heden als de toekomst.\u003c/p>"},{"front":"\u003cp>SDG’s (Sustainable Development Goals)\u003c/p>","back":"\u003cp>Zeventien internationale doelen van de Verenigde Naties om een duurzame, eerlijke en welvarende wereld te realiseren in 2030, met focus op het nu en de nabije toekomst.\u003c/p>"},{"front":"\u003cp>Systeemgrenzen\u003c/p>","back":"\u003cp>De afbakening van wat je wel en niet meeneemt in je analyse van een systeem, wat invloed heeft op je inzichten, oplossingen en impact op korte en lange termijn.\u003c/p>"}]},{"t":"text","heading":"De Drie Dimensies van Duurzaamheid","body":"\u003cp>Duurzaamheid kun je zien als het bouwen en onderhouden van een huis. Dat huis staat symbool voor onze welvaart: de manier waarop we leven, werken en groeien. In dat huis bevinden zich alles wat we belangrijk vinden – gezondheid, veiligheid, comfort, onderwijs, werk en welzijn.\u003c/p>\u003cp>Maar elk huis rust op een fundament. Dat fundament is de aarde zelf, met haar natuurlijke systemen en planetaire grenzen: de kringloop van water, de vruchtbaarheid van de bodem, de stabiliteit van het klimaat en de biodiversiteit die ons leven mogelijk maakt. Als dat fundament begint te verzwakken, verliest het huis zijn draagkracht.\u003c/p>\u003cp>Wat gebeurt er als het fundament rot raakt? Je kunt het huis blijven uitbreiden, meer kamers toevoegen, het mooier schilderen – maar zonder stevig fundament zakt het langzaam in elkaar. Hetzelfde geldt voor onze samenleving: economische groei of sociale vooruitgang blijven niet houdbaar als ze worden gebouwd op een uitgeputte aarde.\u003c/p>\u003cp>De uitdaging is dus niet of we het fundament herstellen vóórdat we het huis verder uitbreiden, maar hoe we beide tegelijk in balans kunnen brengen. Dat is de kern van de drie dimensies van duurzaamheid:\u003c/p>\u003cul>\u003cli>\u003cp>Ecologische duurzaamheid vormt het fundament. Zonder gezonde ecosystemen, schoon water, vruchtbare grond en een stabiel klimaat kunnen geen mensen en economieën floreren.\u003cbr>\u003cbr>Economische duurzaamheid is de structuur van het huis. Het gaat om de manier waarop we waarde creëren en verdelen, zonder de natuurlijke hulpbronnen te ondermijnen waarop die waarde rust. Innovatie en groei blijven belangrijk, maar alleen binnen de draagkracht van het fundament.\u003c/p>\u003c/li>\u003cli>\u003cp>Sociale duurzaamheid is het interieur – het leven dat zich in het huis afspeelt. Het gaat over welzijn, gelijkheid, veiligheid en gemeenschapszin. Een duurzaam huis is niet alleen stevig gebouwd, maar ook een plek waar iedereen zich thuis voelt en kan meedoen.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Als één van deze drie dimensies uit balans raakt, verliest het geheel zijn stabiliteit. Een stevig fundament zonder rechtvaardige samenleving is leeg. Een welvarend interieur zonder ecologische basis is tijdelijk. En een rechtvaardige samenleving zonder economische structuur is kwetsbaar.\u003c/p>\u003cp>Systeemdenken helpt ons te begrijpen hoe deze drie dimensies elkaar beïnvloeden. Wanneer je aan één deel bouwt, beweegt het geheel mee. Echte duurzaamheid betekent dus dat we leren bouwen met inzicht in samenhang: het huis onderhouden en versterken, terwijl we het fundament beschermen waarop het rust.\u003c/p>"},{"t":"accordion","items":[{"title":"Ecologisch","body":"\u003cp>De ecologische dimensie richt zich op het behoud van natuurlijke systemen, biodiversiteit en het respecteren van planetaire grenzen. Dit betekent dat we moeten streven naar een balans tussen menselijke activiteiten en de draagkracht van de aarde. Het beschermen van bossen, schoon water en schone lucht, evenals het voorkomen van uitputting van grondstoffen, zijn cruciale onderdelen van deze dimensie.\u003c/p>\u003cp>Voorbeelden van ecologische duurzaamheid zijn het tegengaan van klimaatverandering door middel van hernieuwbare energiebronnen zoals wind- en zonne-energie, en het herstellen van ecosystemen door herbebossing en het beschermen van bedreigde diersoorten. \u003c/p>"},{"title":"Economisch","body":"\u003cp>De economische dimensie benadrukt dat economische activiteiten afhankelijk zijn van natuurlijke hulpbronnen en dat groei en welvaart duurzaam moeten zijn. Dit betekent dat economische ontwikkeling moet plaatsvinden binnen de grenzen van wat de aarde aankan, zonder toekomstige generaties te benadelen. Circulaire economie, waarbij afval wordt geminimaliseerd en materialen worden hergebruikt, speelt hierin een belangrijke rol.\u003c/p>\u003cp>Een voorbeeld van economische duurzaamheid is het investeren in duurzame innovatie, zoals technologieën die energie-efficiëntie bevorderen of afval omzetten in nieuwe producten. Het eerlijk verdelen van welvaart en het ondersteunen van groene banen zijn ook belangrijke aspecten. \u003c/p>"},{"title":"Sociaal","body":"\u003cp>De sociale dimensie draait om rechtvaardigheid, welzijn en de rol van mensen in duurzame ontwikkeling. Het gaat om het creëren van gelijke kansen, het verbeteren van arbeidsomstandigheden en het betrekken van gemeenschappen bij besluitvorming. Sociale duurzaamheid betekent ook het bevorderen van inclusiviteit en het bestrijden van ongelijkheid.\u003c/p>\u003cp>Voorbeelden zijn het bestrijden van armoede door middel van onderwijsprogramma's en microfinanciering, en het bevorderen van gendergelijkheid in de werkplek. Het creëren van veilige en inclusieve samenlevingen is een ander belangrijk aspect. \u003c/p>"}]},{"t":"continue"},{"t":"quote","body":"Echte verandering begint met het zien van het geheel – niet met losse oplossingen, maar met systeemdenken."},{"t":"text","heading":"Kennisvragen","body":"\u003cp>Test je kennis en reflecteer op wat je tot nu toe hebt geleerd. Deze vragen helpen je om de belangrijkste concepten uit deze les te herhalen en toe te passen. Neem de tijd om goed na te denken over je antwoorden!\u003c/p>"},{"t":"quiz","multi":false,"question":"Een stad kampt met ernstige luchtvervuiling door toenemend autoverkeer. Naast de directe impact op de luchtkwaliteit, zijn er ook andere gevolgen zichtbaar, zoals gezondheidsproblemen en economische kosten. Hoe kan een systeemdenkende aanpak helpen om dit complexe probleem op te lossen?","options":[{"text":"Door de relaties tussen verkeersbeleid, stedelijke planning en gezondheidszorg te analyseren en geïntegreerde oplossingen te ontwikkelen.","correct":true,"feedback":"Correct! Systeemdenken kijkt naar de onderlinge samenhang tussen verschillende domeinen en helpt bij het ontwikkelen van oplossingen die meerdere aspecten tegelijk aanpakken."},{"text":"Door de focus te leggen op het verhogen van boetes voor vervuilende voertuigen om gedragsverandering af te dwingen.","correct":false,"feedback":"Hoewel dit een deel van het probleem kan aanpakken, is het een geïsoleerde maatregel die geen rekening houdt met bredere systeeminteracties."},{"text":"Door technologische innovaties, zoals schonere brandstoffen, te prioriteren zonder andere factoren mee te nemen.","correct":false,"feedback":"Technologische innovaties zijn nuttig, maar zonder aandacht voor bredere systeeminteracties, zoals stedelijke planning en gedrag, blijft de impact beperkt."},{"text":"Door alleen te focussen op het verbeteren van de luchtkwaliteit door meer bomen te planten in de stad.","correct":false,"feedback":"Het planten van bomen kan bijdragen aan betere luchtkwaliteit, maar het lost de onderliggende oorzaken van het probleem, zoals autoverkeer, niet op."}],"feedback":""},{"t":"match","question":"Koppel elk kernconcept met betrekking tot duurzaamheid aan zijn belang of rol in het bereiken van een duurzame toekomst. Denk na over hoe deze concepten bijdragen aan ecologische, economische of sociale dimensies.","pairs":[{"left":"Systeemdenken","right":"Een manier van denken die zich richt op verbindingen, interacties en patronen binnen en tussen systemen, in plaats van op geïsoleerde onderdelen."},{"left":"Duurzaamheid","right":"Het streven naar een balans tussen ecologische, economische en sociale belangen, zodat zowel huidige als toekomstige generaties kunnen voorzien in hun behoeften en welvaart."},{"left":"Triple Bottom Line","right":"Een benadering waarbij organisaties hun prestaties meten op drie vlakken: people (sociaal), planet (ecologisch) en profit (economisch)."},{"left":"SDG’s (Sustainable Development Goals)","right":"Zeventien internationale doelen opgesteld door de Verenigde Naties om een duurzame, eerlijke en welvarende wereld te realiseren in 2030."},{"left":"Systeemgrenzen","right":"De afbakening van wat je wel en niet meeneemt in je analyse van een systeem, wat invloed heeft op je inzichten, oplossingen en impact op korte en lange termijn."}],"feedback":"Goed gedaan! Het begrijpen van deze concepten is essentieel om de basisprincipes van duurzaamheid en hun onderlinge samenhang te doorgronden. Systeemdenken helpt je om verder te kijken dan losse problemen en oplossingen, en om te zien hoe alles met elkaar verbonden is. Dit inzicht is cruciaal voor het maken van duurzame keuzes die zowel op korte als lange termijn effect hebben.","feedbackWrong":"Niet helemaal goed. Neem de tijd om de definities en hun betekenis opnieuw te bekijken. Elk concept speelt een unieke rol in duurzaamheid, en het begrijpen van deze rollen helpt je om beter te begrijpen hoe ecologische, economische en sociale dimensies met elkaar verbonden zijn. Probeer opnieuw en focus op de kern van elk concept."},{"t":"text","heading":"Samenvatting & Volgende Stap","body":"\u003cp>In deze les heb je geleerd wat systeemdenken is, waarom het belangrijk is voor duurzaamheid, en hoe de drie dimensies – ecologisch, economisch en sociaal – met elkaar verbonden zijn. Ook heb je kennisgemaakt met de SDG’s als internationaal kader. In de volgende les duiken we dieper in het aardsysteem en de planetaire grenzen die onze speelruimte bepalen. Denk alvast na over hoe systeemdenken jouw kijk op duurzaamheid verandert en welke rol jij kunt spelen in deze transitie.\u003c/p>"}]},{"id":"m2","title":"Van lineair naar circulair","deadline":"","blocks":[{"t":"text","heading":"Van Wegwerp naar Waardebehoud: De Circulaire Economie","body":"\u003cp>In deze les onderzoeken we waarom het klassieke lineaire economische model – gebaseerd op 'nemen, maken en weggooien' – leidt tot verspilling van grondstoffen en schadelijke milieueffecten. De circulaire economie biedt een duurzaam alternatief door grondstoffen en producten zo lang mogelijk in gebruik te houden. Je leert over praktische strategieën zoals de R-ladder (Refuse, Reduce, Reuse, Repair, Recycle) en circulaire businessmodellen die bedrijven helpen waarde te behouden.\u003c/p>\u003cp>We bekijken een actuele casus uit de Nederlandse textielsector, waar innovatieve bedrijven zoals Loop.a life en MUD Jeans laten zien hoe circulaire principes in de praktijk worden toegepast. Loop.a life recyclet oude kleding tot nieuwe truien, zonder water of verfstoffen te gebruiken, en produceert lokaal om de ecologische voetafdruk te minimaliseren. Meer informatie vind je op hun website: \u003ca rel=\"noopener noreferrer nofollow\" target=\"_blank\" href=\"https://loopalife.com\">https://loopalife.com\u003c/a>.\u003c/p>\u003cp>MUD Jeans hanteert het ‘Lease A Jeans’-model, waarbij klanten een spijkerbroek leasen in plaats van kopen. Na gebruik kan de broek worden teruggestuurd, waarna de producent het materiaal hergebruikt om nieuwe jeans te maken. Dit circulaire businessmodel vermindert afval, stimuleert recycling en houdt waarde in de keten. Lees meer over dit initiatief op de website van CircularX: \u003ca rel=\"noopener noreferrer nofollow\" target=\"_blank\" href=\"https://www.circularx.eu/en/cases/30/mud-jeans-lease-a-jeans\">https://www.circularx.eu/en/cases/30/mud-jeans-lease-a-jeans\u003c/a>.\u003c/p>\u003cp>Voor een visuele introductie in de principes van de circulaire economie kun je de video van de Ellen MacArthur Foundation bekijken hieronder (4min).\u003c/p>\u003cp>Door deze les krijg je niet alleen inzicht in de theorie, maar ook praktische handvatten om als professional bij te dragen aan een duurzamere toekomst. Samen maken we de stap van wegwerp naar waardebehoud.\u003c/p>"},{"t":"video","youtube":"zCRKvDyyHmI","title":"Explaining the Circular Economy and How Society Can Re-think Progress | Animated Video Essay"},{"t":"continue"},{"t":"text","heading":"De R-ladder: Strategieën voor Waardebehoud","body":"\u003cp>De R-ladder biedt een hiërarchie van circulaire strategieën. Hoe hoger op de ladder, hoe meer waarde behouden blijft. Ontdek hieronder de belangrijkste R’s en hoe je ze kunt toepassen in de praktijk.\u003c/p>"},{"t":"accordion","items":[{"title":"Refuse (Weigeren)","body":"\u003cp>Refuse betekent het vermijden van onnodige producten of verpakkingen binnen bedrijfsprocessen. Door bewuste keuzes te maken in de inkoop en het ontwerp van producten, kunnen organisaties afval aan de bron voorkomen. Dit draagt bij aan een duurzamere bedrijfsvoering en vermindert kosten op lange termijn.\u003c/p>\u003cp>Voorbeeld: Een bedrijf dat weigert om producten te verpakken in plastic en in plaats daarvan kiest voor volledig composteerbare materialen. \u003c/p>"},{"title":"Reduce (Verminderen)","body":"\u003cp>Reduce draait om het beperken van grondstofgebruik en afval binnen organisaties. Dit kan door efficiëntere productieprocessen, het gebruik van duurzame materialen en het minimaliseren van verspilling. Het verminderen van afval leidt niet alleen tot een kleinere ecologische voetafdruk, maar ook tot kostenbesparingen.\u003c/p>\u003cp>Voorbeeld: Een fabrikant die zijn productieproces optimaliseert om minder restmateriaal te genereren. \u003c/p>"},{"title":"Reuse (Hergebruiken)","body":"\u003cp>Reuse betekent het opnieuw gebruiken van materialen en producten binnen bedrijfsprocessen. Dit verlengt de levensduur van grondstoffen en vermindert de behoefte aan nieuwe materialen. Hergebruik kan ook leiden tot innovatieve oplossingen en nieuwe zakelijke kansen.\u003c/p>\u003cp>Voorbeeld: Een logistiek bedrijf dat herbruikbare verpakkingen inzet voor transport in plaats van wegwerpverpakkingen. \u003c/p>"},{"title":"Repair (Repareren)","body":"\u003cp>Repair houdt in dat bedrijven defecte producten herstellen in plaats van ze te vervangen. Dit verlengt de levensduur van producten en vermindert afval. Repareren kan ook bijdragen aan klanttevredenheid door betere service en ondersteuning te bieden.\u003c/p>\u003cp>Voorbeeld: Een elektronica fabrikant die een reparatieservice aanbiedt voor oudere modellen in plaats van klanten aan te moedigen nieuwe producten te kopen. \u003c/p>"},{"title":"Recycle (Recyclen)","body":"\u003cp>Recycle is het verwerken van afgedankte materialen tot nieuwe grondstoffen binnen de bedrijfsvoering. Hoewel recyclen minder waardevol is dan hergebruik of reparatie, blijft het een belangrijke stap om afval te verminderen en grondstoffen te behouden. Bedrijven kunnen recyclingprogramma's implementeren om hun impact te verkleinen.\u003c/p>\u003cp>Voorbeeld: Een modebedrijf dat textielafval inzamelt en verwerkt tot nieuwe stoffen. \u003c/p>"}]},{"t":"image","src":"data:image/jpeg;base64,/9j/2wBDAAsICAoIBwsKCQoNDAsNERwSEQ8PESIZGhQcKSQrKigkJyctMkA3LTA9MCcnOEw5PUNFSElIKzZPVU5GVEBHSEX/2wBDAQwNDREPESESEiFFLicuRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUX/wgARCAGFAdcDASIAAhEBAxEB/8QAGgABAAMBAQEAAAAAAAAAAAAAAAIDBAEFBv/EABoBAQEBAQEBAQAAAAAAAAAAAAABAgMEBQb/2gAMAwEAAhADEAAAAfrqL8WsXKGsXqBeoGmMK1vUEvUC9QL1A0K/Fl97nlZz3njyPWePw9jviSPY787uPU541Z7zxrT0++Deeu83PXtPL2G3sZc+gKAAAY9cnRaAAAxbcW+fBvAAFnm+l5+bfCyNiC

OXrJrR4c8xtot7+uQICa6OnGcHR4011x6UiFA0j64XBKUqqrVXuuXLly5cuXLlz4D67CjH6yHzly5cuXLly5cuXLlzakHvpS/H0gdM/TZ+uz9dn67P12frs/XYvyn4z9dn67P12frs/XZ+uz9dn67P12aZofGfrs/XZ+uz9dn67P12frs/XZ+uz9dn67P12frs/XZ+uz9dn67P12frs/XZ+uwAIaPrOiJQXd5N/wA2GGGGGGGGGGGGACJCfSf/2Q==","w":471,"h":389,"caption":"De R-ladder: tien strategieën van R0 Refuse tot R9 Recover. Hoe hoger op de ladder, hoe meer waarde behouden blijft. Bron: RLI 2015, bewerking PBL."},{"t":"continue"},{"t":"text","heading":"De Weg van Textiel: Van Lineair naar Circulair","body":"\u003cp>De levenscyclus van textiel laat goed zien hoe een product van lineair naar circulair kan bewegen. Bekijk hieronder de belangrijkste stappen en verschillen.\u003c/p>"},{"t":"timeline","items":[{"date":"Productie & Consumptie (Lineair)","title":"Traditioneel textielpad","body":"\u003cp>Grondstoffen worden gewonnen, verwerkt tot kleding en na korte tijd weggegooid. Dit leidt tot veel afval en verspilling van waarde.\u003c/p>"},{"date":"Afval & Downcycling","title":"Einde levensduur (Lineair)","body":"\u003cp>Afgedankt textiel wordt vaak verbrand of laagwaardig gerecycled, waardoor waarde grotendeels verloren gaat.\u003c/p>"},{"date":"Circulair Ontwerp & Hergebruik","title":"Nieuwe circulaire aanpak","body":"\u003cp>Kleding wordt ontworpen voor hergebruik en recycling. Producten krijgen een tweede leven via inzameling, reparatie of upcycling.\u003c/p>"},{"date":"Nieuwe Businessmodellen","title":"Innovatie in de sector","body":"\u003cp>Bedrijven experimenteren met leasemodellen, deelplatforms en refurbishen om textiel langer in de kringloop te houden.\u003c/p>"}]},{"t":"quote","body":"Elke keuze in het ontwerp, gebruik en afdanken van producten bepaalt of we waarde behouden – of verspillen."},{"t":"continue"},{"t":"text","heading":"Kennisvragen","body":"\u003cp>Test je kennis en reflecteer op wat je hebt geleerd. De volgende opdrachten helpen je om de kernconcepten uit deze les te herhalen en toe te passen op praktijkvoorbeelden.\u003c/p>"},{"t":"quiz","multi":false,"question":"Wat is een belangrijk verschil tussen de lineaire en circulaire economie?","options":[{"text":"De lineaire economie minimaliseert afval, de circulaire economie maximaliseert afval.","correct":false,"feedback":"Dit klopt niet. De circulaire economie streeft juist naar het minimaliseren van afval."},{"text":"De lineaire economie richt zich op korte termijn gebruik en weggooien, de circulaire economie op het behouden van waarde en sluiten van kringlopen.","correct":true,"feedback":"Juist! De circulaire economie draait om waardebehoud en het sluiten van kringlopen."},{"text":"In de circulaire economie worden producten nooit hergebruikt.","correct":false,"feedback":"Dit is onjuist. Hergebruik is juist een belangrijk onderdeel van de circulaire economie."},{"text":"De lineaire economie stimuleert delen en leasen van producten.","correct":false,"feedback":"Delen en leasen zijn juist kenmerken van de circulaire economie."}],"feedback":""},{"t":"text","heading":"Zet de R-strategieën in volgorde van hoogste naar laagste waardebehoud.","body":"\u003cp>De volgorde van de R-strategieën bepaalt hoeveel waarde behouden blijft in de keten. Strategieën die afval voorkomen of producten langer in gebruik houden, leveren het meeste op. Zet de volgende R’s op de juiste plek.\u003c/p>"},{"t":"sort","piles":["Hoogste waardebehoud","Laagste waardebehoud"],"items":[{"text":"Refuse","pile":0},{"text":"Reuse","pile":0},{"text":"Repair","pile":1},{"text":"Recycle","pile":1},{"text":"Recover","pile":1}]},{"t":"text","heading":"Samenvatting & Vooruitblik","body":"\u003cp>Je hebt geleerd waarom het lineaire model niet langer houdbaar is en hoe circulaire strategieën zoals de R-ladder en nieuwe businessmodellen waarde kunnen behouden. De textielcasus laat zien dat de omslag naar circulariteit urgent én haalbaar is. In de volgende les onderzoeken we de fysica en systeemuitdagingen van klimaatverandering en infrastructuur. Denk alvast na over hoe jij circulaire strategieën kunt toepassen in je eigen (toekomstige) werkpraktijk.\u003c/p>"}]}]}</script>
<script>
/*
 * E-learningspeler. Dezelfde speler als in minor-ce-elearnings, maar los van
 * fetch en van document.body: hij tekent in een element dat je meegeeft.
 * Zo draait hij zowel in het voorbeeld van de bouwer als in een geëxporteerd
 * bestand.
 *
 *   Speler(root, cursus, {
 *     sleutel: 'elearning:',   voorvoegsel voor de voortgang in localStorage
 *     hash: true,              module in location.hash (alleen in een eigen pagina)
 *     scroller: window,        wat er scrolt
 *     voorbeeld: false,        externe video's en insluitingen als plaatshouder
 *     allesTonen: false,       alle stukken open, zonder doorgaan-knoppen
 *     opModule: function (id) {},  melding als de lezer een module opent
 *     opslag: { lees, schrijf }    eigen opslag van de voortgang, bijvoorbeeld
 *                                  een LMS via SCORM; anders localStorage
 *   })
 */
function Speler(root, cursus, opts) {
  'use strict';
  opts = opts || {};
  var sleutel = (opts.sleutel || 'elearning:') + cursus.id;
  var staat = leesStaat();
  var huidig = null;

  function leesStaat() {
    try {
      var ruw = opts.opslag ? opts.opslag.lees() : localStorage.getItem(sleutel);
      var s = JSON.parse(ruw || 'null');
      return s && s.modules ? s : { modules: {} };
    } catch (e) {
      return { modules: {} };
    }
  }

  function bewaar() {
    try {
      if (opts.opslag) opts.opslag.schrijf(JSON.stringify(staat), staat, huidig);
      else localStorage.setItem(sleutel, JSON.stringify(staat));
    } catch (e) { /* privacymodus of LMS weg */ }
  }

  function moduleStaat(id) {
    if (!staat.modules[id]) staat.modules[id] = { segment: 0, af: false, antwoorden: {} };
    return staat.modules[id];
  }

  /* ------------------------------------------------------------ hulp */

  function el(tag, klasse, tekst) {
    var e = document.createElement(tag);
    if (klasse) e.className = klasse;
    if (tekst !== undefined && tekst !== null) e.textContent = tekst;
    return e;
  }

  function html(tag, klasse, inhoud) {
    var e = document.createElement(tag);
    if (klasse) e.className = klasse;
    if (inhoud) e.innerHTML = inhoud;
    return e;
  }

  function naarBoven() {
    var s = opts.scroller || window;
    if (s === window) window.scrollTo(0, 0); else s.scrollTop = 0;
  }

  /* Het adres bijwerken mag mislukken: in sommige frames van een leeromgeving
     is de geschiedenis afgeschermd. De speler werkt dan gewoon zonder. */
  function zetAdres(adres) {
    try { history.replaceState(null, '', adres); } catch (e) { /* afgeschermd frame */ }
  }

  function host(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  }

  /* Platte tekst in een element zetten, met webadressen als klikbare link. */
  function metLinks(doel, tekst) {
    String(tekst).split(/(https?:\/\/[^\s]+)/).forEach(function (stuk, i) {
      if (i % 2 === 0) {
        if (stuk) doel.appendChild(document.createTextNode(stuk));
        return;
      }
      var staart = (stuk.match(/[.,;:)]+$/) || [''])[0];
      var adres = stuk.slice(0, stuk.length - staart.length);
      var a = el('a', null, adres.replace(/^https?:\/\//, '').replace(/\/$/, ''));
      a.href = adres;
      a.target = '_blank';
      a.rel = 'noopener';
      doel.appendChild(a);
      if (staart) doel.appendChild(document.createTextNode(staart));
    });
    return doel;
  }

  /* Blokken opdelen in stukken tot aan elke doorgaan-knop. Elk blok onthoudt
     zijn plek in de module, zodat de bouwer ernaartoe kan scrollen. */
  function segmenteer(blokken) {
    var segmenten = [];
    var huidigSeg = [];
    blokken.forEach(function (b, gi) {
      if (b.t === 'continue') {
        segmenten.push(huidigSeg);
        huidigSeg = [];
      } else {
        huidigSeg.push({ blok: b, gi: gi });
      }
    });
    if (huidigSeg.length) segmenten.push(huidigSeg);
    return segmenten.filter(function (s) { return s.length; });
  }

  function vraagId(moduleId, segIndex, blokIndex) {
    return moduleId + ':' + segIndex + ':' + blokIndex;
  }

  /* Vaste, maar per vraag verschillende volgorde (Fisher-Yates, geseed). */
  function husselVolgorde(id, aantal) {
    var zaad = 1;
    for (var c = 0; c < id.length; c++) zaad = (zaad * 31 + id.charCodeAt(c)) % 2147483647;
    function volgende() {
      zaad = (zaad * 16807) % 2147483647;
      return zaad / 2147483647;
    }
    var volgorde = [];
    for (var i = 0; i < aantal; i++) volgorde.push(i);
    for (var j = aantal - 1; j > 0; j--) {
      var k = Math.floor(volgende() * (j + 1));
      var tmp = volgorde[j]; volgorde[j] = volgorde[k]; volgorde[k] = tmp;
    }
    return volgorde;
  }

  /* ------------------------------------------------------------ startpagina */

  function toonStart() {
    huidig = null;
    if (opts.hash && location.hash) zetAdres(location.pathname + location.search);
    if (opts.hash) document.title = cursus.title;
    root.innerHTML = '';

    var totaalSeg = 0, gedaanSeg = 0;
    cursus.lessons.forEach(function (les) {
      var segs = segmenteer(les.blocks).length;
      var ms = moduleStaat(les.id);
      totaalSeg += segs;
      gedaanSeg += Math.min(ms.af ? segs : ms.segment, segs);
    });
    var percentage = totaalSeg ? Math.round((gedaanSeg / totaalSeg) * 100) : 0;
    var begonnen = gedaanSeg > 0;

    var hero = el('header', 'hero');
    var binnen = el('div', 'hero-inner');
    if (cursus.kicker !== '') binnen.appendChild(el('p', 'kicker', cursus.kicker || 'E-learning'));
    binnen.appendChild(el('h1', null, cursus.title || 'Naamloze e-learning'));
    if (cursus.subtitle) binnen.appendChild(el('p', 'sub', cursus.subtitle));

    if (cursus.author) {
      var au = el('div', 'auteur');
      var initialen = cursus.author.split(/\s+/).filter(Boolean).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
      au.appendChild(el('span', 'bol', initialen));
      au.appendChild(el('span', null, 'Door ' + cursus.author));
      binnen.appendChild(au);
    }

    if (cursus.lessons.length) {
      var allesAf = cursus.lessons.every(function (l) { return moduleStaat(l.id).af; });
      var start = el('button', 'btn-groot',
        allesAf ? 'Cursus opnieuw bekijken' : (begonnen ? 'Verder waar je gebleven was' : 'Start de cursus'));
      start.type = 'button';
      start.addEventListener('click', function () {
        var doel = cursus.lessons.find(function (l) { return !moduleStaat(l.id).af; }) || cursus.lessons[0];
        openModule(doel.id);
      });
      binnen.appendChild(start);
    }

    if (begonnen) {
      var vb = el('div', 'voortgangsbalk');
      var spoor = el('div', 'spoor');
      var vulling = el('div', 'vulling');
      vulling.style.width = percentage + '%';
      spoor.appendChild(vulling);
      vb.appendChild(spoor);
      vb.appendChild(el('div', 'tekst', percentage + '% van de cursus doorlopen'));
      binnen.appendChild(vb);
    }

    hero.appendChild(binnen);
    root.appendChild(hero);

    var lijst = el('div', 'modules');
    if (cursus.intro) lijst.appendChild(el('p', 'intro', cursus.intro));

    cursus.lessons.forEach(function (les, i) {
      var segs = segmenteer(les.blocks).length;
      var ms = moduleStaat(les.id);
      var gedaan = ms.af ? segs : Math.min(ms.segment, segs);
      var pct = segs ? Math.round((gedaan / segs) * 100) : 0;

      var kaart = el('button', 'module-kaart' + (ms.af ? ' af' : (gedaan > 0 ? ' bezig' : '')));
      kaart.type = 'button';
      kaart.appendChild(el('span', 'nummer', ms.af ? '✓' : String(i + 1)));

      var midden = el('span');
      midden.appendChild(el('h2', null, les.title || 'Module ' + (i + 1)));
      var regel = el('span', 'regel');
      if (les.deadline) regel.appendChild(el('span', 'deadline', 'Afronden vóór ' + les.deadline));
      regel.appendChild(el('span', null, ms.af ? 'Afgerond' : (gedaan > 0 ? pct + '% gelezen' : segs + (segs === 1 ? ' onderdeel' : ' onderdelen'))));
      if (gedaan > 0 && !ms.af) {
        var mini = el('span', 'mini-spoor');
        var i2 = el('i');
        i2.style.width = pct + '%';
        mini.appendChild(i2);
        regel.appendChild(mini);
      }
      midden.appendChild(regel);
      kaart.appendChild(midden);
      kaart.appendChild(el('span', 'pijl', '→'));
      kaart.addEventListener('click', function () { openModule(les.id); });
      lijst.appendChild(kaart);
    });

    if (!cursus.lessons.length) lijst.appendChild(el('p', 'intro', 'Deze e-learning heeft nog geen modules.'));

    root.appendChild(lijst);
    naarBoven();
    if (opts.opModule) opts.opModule(null);
  }

  /* ------------------------------------------------------------ blokweergave */

  /* Externe inhoud kan in het voorbeeld van de bouwer niet worden geladen;
     daar toont de speler een kaart die zegt wat er komt. */
  function externVoorbeeld(soort, titel, url) {
    var k = el('div', 'extern-voorbeeld');
    k.appendChild(el('span', 'speel', soort === 'video' ? '▶' : '⧉'));
    var t = el('span');
    t.appendChild(el('strong', null, titel || (soort === 'video' ? 'Video' : 'Ingesloten inhoud')));
    t.appendChild(el('span', 'bron', (host(url) || url) + ' · speelt af in de geëxporteerde e-learning'));
    k.appendChild(t);
    return k;
  }

  function tekenBlok(blok, moduleId, segIndex, blokIndex, opWijziging) {
    switch (blok.t) {

      case 'text': {
        var wrap = el('div', 'blok');
        if (blok.heading) wrap.appendChild(el('h2', null, blok.heading));
        if (blok.body) wrap.appendChild(html('div', null, blok.body));
        return wrap;
      }

      case 'list': {
        var lijst = el(blok.ordered ? 'ol' : 'ul');
        (blok.items || []).forEach(function (i) { lijst.appendChild(html('li', null, i)); });
        var w = el('div', 'blok');
        w.appendChild(lijst);
        return w;
      }

      case 'image': {
        if (!blok.src) return null;
        var fig = el('figure', 'beeld');
        var img = document.createElement('img');
        img.decoding = 'async';
        img.alt = blok.alt || blok.caption || '';
        if (blok.w) {
          img.width = blok.w;
          img.height = blok.h;
          img.style.maxWidth = blok.w + 'px';
        }
        img.src = blok.src;
        fig.appendChild(img);
        if (blok.caption) fig.appendChild(metLinks(el('figcaption'), blok.caption));
        return fig;
      }

      case 'video': {
        var houder = el('div');
        var titel = blok.title || 'Video';
        var bron = blok.youtube ? 'https://www.youtube.com/watch?v=' + blok.youtube
          : blok.vimeo ? 'https://vimeo.com/' + blok.vimeo : blok.url;
        if (!bron) return null;
        if (opts.voorbeeld && (blok.youtube || blok.vimeo)) {
          houder.appendChild(externVoorbeeld('video', titel, bron));
          return houder;
        }
        if (blok.url && !blok.youtube && !blok.vimeo) {
          /* Een video op een site die niet ingesloten wil worden. */
          var ext = el('a', 'video-extern');
          ext.href = blok.url;
          ext.target = '_blank';
          ext.rel = 'noopener';
          ext.appendChild(el('span', 'speel', '▶'));
          var tekstje = el('span');
          tekstje.appendChild(el('strong', null, titel));
          tekstje.appendChild(el('span', 'bron', 'Bekijk de video op ' + (host(blok.url) || 'de site van de maker') + ' ↗'));
          ext.appendChild(tekstje);
          houder.appendChild(ext);
          return houder;
        }
        var kader = el('div', 'video');
        var fr = document.createElement('iframe');
        if (blok.vimeo) {
          fr.src = 'https://player.vimeo.com/video/' + blok.vimeo + '?dnt=1';
        } else {
          var params = 'rel=0&modestbranding=1';
          if (blok.start) params += '&start=' + blok.start;
          fr.src = 'https://www.youtube-nocookie.com/embed/' + blok.youtube + '?' + params;
        }
        fr.title = titel;
        fr.loading = 'lazy';
        fr.allow = 'accelerometer; clipboard-write; encrypted-media; picture-in-picture; fullscreen';
        fr.allowFullscreen = true;
        kader.appendChild(fr);
        houder.appendChild(kader);
        if (blok.title) houder.appendChild(el('div', 'video-titel', blok.title));
        return houder;
      }

      case 'embed': {
        /* Elke site die zich laat insluiten: Padlet, Mentimeter, Google
           Slides, Canva, Genially, H5P, Spotify. Met een link eronder voor als
           de site het insluiten toch weigert. */
        if (!blok.url) return null;
        var fig2 = el('figure', 'insluiting');
        if (opts.voorbeeld) {
          fig2.appendChild(externVoorbeeld('embed', blok.title, blok.url));
          return fig2;
        }
        var kader2 = el('div', 'insluiting-kader');
        kader2.style.height = (blok.height || 480) + 'px';
        var fr2 = document.createElement('iframe');
        fr2.src = blok.url;
        fr2.title = blok.title || 'Ingesloten inhoud';
        fr2.loading = 'lazy';
        fr2.allow = 'fullscreen; clipboard-write; autoplay; encrypted-media; picture-in-picture';
        fr2.allowFullscreen = true;
        kader2.appendChild(fr2);
        fig2.appendChild(kader2);
        var onder = el('figcaption');
        if (blok.title) onder.appendChild(el('span', null, blok.title + ' · '));
        var a2 = el('a', null, 'Open op ' + (host(blok.url) || 'de site') + ' ↗');
        a2.href = blok.url;
        a2.target = '_blank';
        a2.rel = 'noopener';
        onder.appendChild(a2);
        fig2.appendChild(onder);
        return fig2;
      }

      case 'tabs': {
        if (!(blok.items || []).length) return null;
        var t = el('div', 'tabs');
        var knoppen = el('div', 'tab-knoppen');
        knoppen.setAttribute('role', 'tablist');
        var inhoud = el('div', 'tab-inhoud');
        blok.items.forEach(function (tab, i) {
          var k = el('button', null, tab.title || 'Tab ' + (i + 1));
          k.type = 'button';
          k.setAttribute('role', 'tab');
          k.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
          k.addEventListener('click', function () {
            knoppen.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-selected', 'false'); });
            k.setAttribute('aria-selected', 'true');
            inhoud.innerHTML = tab.body || '';
          });
          knoppen.appendChild(k);
        });
        inhoud.innerHTML = blok.items[0].body || '';
        t.appendChild(knoppen);
        t.appendChild(inhoud);
        return t;
      }

      case 'accordion': {
        if (!(blok.items || []).length) return null;
        var acc = el('div', 'accordeon');
        blok.items.forEach(function (item) {
          var d = document.createElement('details');
          d.appendChild(el('summary', null, item.title || 'Onderdeel'));
          d.appendChild(html('div', 'accordeon-inhoud', item.body));
          acc.appendChild(d);
        });
        return acc;
      }

      case 'cards': {
        if (!(blok.items || []).length) return null;
        var houder2 = el('div', 'kaartjes-blok');
        houder2.appendChild(el('div', 'kaartjes-hint', 'Klik op een kaartje om het om te draaien.'));
        var rooster = el('div', 'kaartjes');
        blok.items.forEach(function (k) {
          var kaartje = el('div', 'kaartje');
          kaartje.setAttribute('role', 'button');
          kaartje.tabIndex = 0;
          kaartje.setAttribute('aria-pressed', 'false');
          kaartje.appendChild(html('div', 'voorkant', k.front));
          kaartje.appendChild(html('div', 'achterkant', k.back));
          var draai = function () {
            kaartje.setAttribute('aria-pressed', kaartje.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
          };
          kaartje.addEventListener('click', draai);
          kaartje.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); draai(); }
          });
          rooster.appendChild(kaartje);
        });
        houder2.appendChild(rooster);
        return houder2;
      }

      case 'quote':
        return blok.body ? html('blockquote', 'statement', blok.body) : null;

      case 'links': {
        var items = (blok.items || []).filter(function (l) { return l.href; });
        if (!items.length) return null;
        var lw = el('div', 'linkjes');
        items.forEach(function (l) {
          var a = el('a', 'linkknop', l.label || host(l.href) || l.href);
          a.href = l.href;
          a.target = '_blank';
          a.rel = 'noopener';
          a.appendChild(el('span', 'pijltje', '↗'));
          lw.appendChild(a);
        });
        return lw;
      }

      case 'timeline': {
        if (!(blok.items || []).length) return null;
        var tl = el('ol', 'tijdlijn');
        blok.items.forEach(function (p) {
          var li = el('li');
          if (p.date) li.appendChild(el('div', 'tijdlijn-label', p.date));
          if (p.title) li.appendChild(el('h3', null, p.title));
          if (p.body) li.appendChild(html('div', null, p.body));
          tl.appendChild(li);
        });
        return tl;
      }

      case 'steps': {
        var st = el('div', 'stappenplan');
        st.appendChild(el('div', 'label', 'Stappenplan'));
        if (blok.intro && (blok.intro.title || blok.intro.body)) {
          if (blok.intro.title) st.appendChild(el('h3', null, blok.intro.title));
          if (blok.intro.body) st.appendChild(el('p', null, blok.intro.body));
        }
        var ol = el('ol', 'stappen');
        (blok.steps || []).forEach(function (s) {
          var li = el('li');
          li.appendChild(el('strong', null, s.title));
          if (s.body) li.appendChild(el('p', null, s.body));
          ol.appendChild(li);
        });
        st.appendChild(ol);
        if (blok.summary && (blok.summary.title || blok.summary.body)) {
          var sam = el('div', 'stappen-slot');
          if (blok.summary.title) sam.appendChild(el('strong', null, blok.summary.title));
          if (blok.summary.body) sam.appendChild(el('p', null, blok.summary.body));
          st.appendChild(sam);
        }
        return st;
      }

      case 'svg': {
        var fig3 = el('figure', 'schema');
        var doos = el('div', 'schema-vlak');
        doos.innerHTML = blok.svg || '';
        var s = doos.querySelector('svg');
        if (s) {
          s.setAttribute('role', 'img');
          if (blok.alt) s.setAttribute('aria-label', blok.alt);
        }
        fig3.appendChild(doos);
        if (blok.caption) fig3.appendChild(el('figcaption', null, blok.caption));
        return fig3;
      }

      case 'quiz':
        if (!(blok.options || []).length) return null;
        return tekenQuiz(blok, moduleId, segIndex, blokIndex, opWijziging);

      case 'match':
        if (!(blok.pairs || []).length) return null;
        return tekenKoppel(blok, moduleId, segIndex, blokIndex, opWijziging);

      case 'sort':
        if (!(blok.items || []).length || !(blok.piles || []).length) return null;
        return tekenSorteer(blok, moduleId, segIndex, blokIndex, opWijziging);
    }
    return null;
  }

  /* Blokken die beantwoord moeten zijn voordat de doorgaan-knop opengaat. */
  var VRAAGTYPEN = ['quiz', 'match', 'sort'];

  function telbaar(b) {
    if (b.t === 'quiz') return (b.options || []).length > 0;
    if (b.t === 'match') return (b.pairs || []).length > 0;
    if (b.t === 'sort') return (b.items || []).length > 0 && (b.piles || []).length > 0;
    return false;
  }

  /* -------------------------------------------- meerkeuze en meervoudig */

  function tekenQuiz(blok, moduleId, segIndex, blokIndex, opWijziging) {
    var id = vraagId(moduleId, segIndex, blokIndex);
    var ms = moduleStaat(moduleId);
    var bewaard = ms.antwoorden[id];

    var kaart = el('div', 'vraag');
    kaart.appendChild(el('div', 'label', blok.multi ? 'Meerdere antwoorden' : 'Kennisvraag'));
    kaart.appendChild(html('div', 'stelling', blok.question));

    var gekozen = bewaard ? bewaard.keuze.slice() : [];
    var nagekeken = !!bewaard;

    var opties = el('div', 'opties');
    var knoppen = [];

    blok.options.forEach(function (optie, i) {
      var k = el('button', 'optie');
      k.type = 'button';
      if (blok.multi) k.setAttribute('data-multi', '1');
      k.setAttribute('aria-pressed', 'false');
      k.appendChild(el('span', 'vink', blok.multi ? '✓' : '●'));
      k.appendChild(el('span', null, optie.text));
      k.addEventListener('click', function () {
        if (nagekeken) return;
        if (blok.multi) {
          var p = gekozen.indexOf(i);
          if (p >= 0) gekozen.splice(p, 1); else gekozen.push(i);
        } else {
          gekozen = [i];
        }
        knoppen.forEach(function (b, j) { b.setAttribute('aria-pressed', gekozen.indexOf(j) >= 0 ? 'true' : 'false'); });
        nakijkKnop.disabled = gekozen.length === 0;
      });
      knoppen.push(k);
      opties.appendChild(k);
    });
    kaart.appendChild(opties);

    var acties = el('div', 'vraag-acties');
    var nakijkKnop = el('button', 'knop-klein', 'Nakijken');
    nakijkKnop.type = 'button';
    nakijkKnop.disabled = true;
    var opnieuwKnop = el('button', 'knop-klein stil', 'Opnieuw proberen');
    opnieuwKnop.type = 'button';
    opnieuwKnop.style.display = 'none';
    acties.appendChild(nakijkKnop);
    acties.appendChild(opnieuwKnop);
    kaart.appendChild(acties);

    var uitslagVak = el('div');
    kaart.appendChild(uitslagVak);

    function toonUitslag(keuze) {
      var juist = blok.options.map(function (o, i) { return o.correct ? i : -1; }).filter(function (i) { return i >= 0; });
      var goed = juist.length === keuze.length && juist.every(function (i) { return keuze.indexOf(i) >= 0; });

      knoppen.forEach(function (b, i) {
        b.disabled = true;
        b.setAttribute('aria-pressed', keuze.indexOf(i) >= 0 ? 'true' : 'false');
        if (blok.options[i].correct) b.classList.add('goed');
        else if (keuze.indexOf(i) >= 0) b.classList.add('fout');
      });

      uitslagVak.innerHTML = '';
      var u = el('div', 'uitslag ' + (goed ? 'goed' : 'fout'));
      var uitleg = (!goed && blok.feedbackWrong) ? blok.feedbackWrong : blok.feedback;
      u.textContent = goed
        ? 'Klopt.' + (uitleg ? ' ' + uitleg : '')
        : 'Niet helemaal. De juiste antwoorden staan hierboven groen.' + (uitleg ? ' ' + uitleg : '');
      uitslagVak.appendChild(u);

      knoppen.forEach(function (b, i) {
        var o = blok.options[i];
        if (!o.feedback) return;
        if (keuze.indexOf(i) < 0 && !(o.correct && !goed)) return;
        b.children[1].appendChild(el('span', 'optie-uitleg', o.feedback));
      });

      nakijkKnop.style.display = 'none';
      opnieuwKnop.style.display = goed ? 'none' : '';
      return goed;
    }

    nakijkKnop.addEventListener('click', function () {
      nagekeken = true;
      var goed = toonUitslag(gekozen);
      ms.antwoorden[id] = { keuze: gekozen.slice(), goed: goed };
      bewaar();
      opWijziging();
    });

    opnieuwKnop.addEventListener('click', function () {
      nagekeken = false;
      gekozen = [];
      delete ms.antwoorden[id];
      bewaar();
      knoppen.forEach(function (b) {
        b.disabled = false;
        b.classList.remove('goed', 'fout');
        b.setAttribute('aria-pressed', 'false');
        var weg = b.querySelector('.optie-uitleg');
        if (weg) weg.remove();
      });
      uitslagVak.innerHTML = '';
      nakijkKnop.style.display = '';
      nakijkKnop.disabled = true;
      opnieuwKnop.style.display = 'none';
      opWijziging();
    });

    if (bewaard && bewaard.keuze.every(function (i) { return i < blok.options.length; })) toonUitslag(bewaard.keuze);
    else if (bewaard) { delete ms.antwoorden[id]; nagekeken = false; gekozen = []; }

    kaart.dataset.vraag = id;
    return kaart;
  }

  /* -------------------------------------------- keuzerijen */

  /* Gedeelde opbouw voor de koppelvraag en de sorteeropdracht: per rij een
     onderdeel met knoppen om uit te kiezen, geen uitklaplijst. */
  function tekenKeuzeVraag(cfg, moduleId, segIndex, blokIndex, opWijziging) {
    var id = vraagId(moduleId, segIndex, blokIndex);
    var ms = moduleStaat(moduleId);
    var bewaard = ms.antwoorden[id];

    var kaart = el('div', 'vraag');
    kaart.appendChild(el('div', 'label', cfg.label));
    kaart.appendChild(cfg.stelling);
    if (cfg.voorRijen) kaart.appendChild(cfg.voorRijen);

    var keuze = cfg.rijen.map(function () { return ''; });
    var nagekeken = false;

    var houder = el('div', 'keuzerijen' + (cfg.letters ? ' met-letters' : ''));
    var rijen = cfg.rijen.map(function (r) {
      var rij = el('div', 'keuzerij');
      var kop = el('div', 'keuzerij-tekst', r.tekst);
      kop.id = 'k-' + id.replace(/[^a-zA-Z0-9]/g, '-') + '-' + r.sleutel;
      rij.appendChild(kop);
      var groep = el('div', 'keuzeknoppen');
      groep.setAttribute('role', 'group');
      groep.setAttribute('aria-labelledby', kop.id);
      var knoppen = cfg.opties.map(function (o) {
        var k = el('button', 'keuzeknop', o.knop);
        k.type = 'button';
        k.setAttribute('aria-pressed', 'false');
        if (o.tekst && o.tekst !== o.knop) k.setAttribute('aria-label', o.knop + ': ' + o.tekst);
        k.addEventListener('click', function () { kies(r.sleutel, o.waarde); });
        groep.appendChild(k);
        return k;
      });
      rij.appendChild(groep);
      var gekozen = el('div', 'keuzerij-gekozen');
      rij.appendChild(gekozen);
      houder.appendChild(rij);
      return { r: r, rij: rij, knoppen: knoppen, gekozen: gekozen };
    });
    kaart.appendChild(houder);

    var acties = el('div', 'vraag-acties');
    var nakijkKnop = el('button', 'knop-klein', 'Nakijken');
    nakijkKnop.type = 'button';
    nakijkKnop.disabled = true;
    var opnieuwKnop = el('button', 'knop-klein stil', 'Opnieuw proberen');
    opnieuwKnop.type = 'button';
    opnieuwKnop.style.display = 'none';
    acties.appendChild(nakijkKnop);
    acties.appendChild(opnieuwKnop);
    kaart.appendChild(acties);

    var uitslagVak = el('div');
    kaart.appendChild(uitslagVak);

    function optieBij(waarde) {
      return cfg.opties.find(function (o) { return o.waarde === String(waarde); });
    }

    function werkBij() {
      rijen.forEach(function (x) {
        var w = keuze[x.r.sleutel];
        x.knoppen.forEach(function (k, j) {
          k.setAttribute('aria-pressed', cfg.opties[j].waarde === w ? 'true' : 'false');
        });
        var o = w !== '' ? optieBij(w) : null;
        x.gekozen.textContent = (cfg.toonKeuze && o) ? o.tekst : '';
      });
      nakijkKnop.disabled = keuze.some(function (w) { return w === ''; });
    }

    function kies(sleutelRij, waarde) {
      if (nagekeken) return;
      if (cfg.uniek) {
        keuze.forEach(function (w, n) { if (w === waarde && n !== sleutelRij) keuze[n] = ''; });
      }
      keuze[sleutelRij] = keuze[sleutelRij] === waarde ? '' : waarde;
      werkBij();
    }

    function toonUitslag(antwoord) {
      nagekeken = true;
      keuze = antwoord.map(String);
      werkBij();
      var goedAantal = 0;
      rijen.forEach(function (x) {
        x.knoppen.forEach(function (k) { k.disabled = true; });
        if (keuze[x.r.sleutel] === String(x.r.juist)) {
          x.rij.classList.add('goed');
          goedAantal++;
        } else {
          x.rij.classList.add('fout');
          x.rij.appendChild(el('div', 'keuzerij-correctie', cfg.correctie(x.r)));
        }
      });
      var alles = goedAantal === rijen.length;
      uitslagVak.innerHTML = '';
      var u = el('div', 'uitslag ' + (alles ? 'goed' : 'fout'));
      var uitleg = (!alles && cfg.feedbackWrong) ? cfg.feedbackWrong : cfg.feedback;
      u.textContent = (alles ? cfg.allesGoed : goedAantal + ' van de ' + rijen.length + ' goed. ' + cfg.deelsGoed)
        + (uitleg ? ' ' + uitleg : '');
      uitslagVak.appendChild(u);
      nakijkKnop.style.display = 'none';
      opnieuwKnop.style.display = alles ? 'none' : '';
      return alles;
    }

    nakijkKnop.addEventListener('click', function () {
      var antwoord = keuze.slice();
      var goed = toonUitslag(antwoord);
      ms.antwoorden[id] = { keuze: antwoord, goed: goed };
      bewaar();
      opWijziging();
    });

    opnieuwKnop.addEventListener('click', function () {
      delete ms.antwoorden[id];
      bewaar();
      nagekeken = false;
      keuze = keuze.map(function () { return ''; });
      rijen.forEach(function (x) {
        x.knoppen.forEach(function (k) { k.disabled = false; });
        x.rij.classList.remove('goed', 'fout');
        var weg = x.rij.querySelector('.keuzerij-correctie');
        if (weg) weg.remove();
      });
      werkBij();
      uitslagVak.innerHTML = '';
      nakijkKnop.style.display = '';
      opnieuwKnop.style.display = 'none';
      opWijziging();
    });

    /* Een bewaard antwoord telt alleen als het nog bij deze vraag past; na
       een wijziging in de bouwer begint de vraag opnieuw. */
    if (bewaard && bewaard.keuze.length === cfg.rijen.length) toonUitslag(bewaard.keuze);
    else if (bewaard) delete ms.antwoorden[id];

    kaart.dataset.vraag = id;
    return kaart;
  }

  /* -------------------------------------------- koppelvraag */

  function tekenKoppel(blok, moduleId, segIndex, blokIndex, opWijziging) {
    var id = vraagId(moduleId, segIndex, blokIndex);
    var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    var opties = husselVolgorde(id, blok.pairs.length).map(function (bij, n) {
      return { knop: letters[n], waarde: String(bij), tekst: blok.pairs[bij].right };
    });

    var lijst = el('ol', 'omschrijvingen');
    opties.forEach(function (o) {
      var li = el('li');
      li.appendChild(el('span', 'letter', o.knop));
      li.appendChild(el('span', null, o.tekst));
      lijst.appendChild(li);
    });

    return tekenKeuzeVraag({
      label: 'Koppelvraag',
      stelling: html('div', 'stelling', blok.question),
      voorRijen: lijst,
      letters: true,
      uniek: true,
      toonKeuze: true,
      rijen: blok.pairs.map(function (p, i) { return { tekst: p.left, sleutel: i, juist: i }; }),
      opties: opties,
      correctie: function (r) {
        var o = opties.find(function (x) { return x.waarde === String(r.juist); });
        return 'Juist is ' + o.knop + ': ' + o.tekst;
      },
      allesGoed: 'Allemaal goed gekoppeld.',
      deelsGoed: 'Bij de rode staat de juiste omschrijving.',
      feedback: blok.feedback,
      feedbackWrong: blok.feedbackWrong
    }, moduleId, segIndex, blokIndex, opWijziging);
  }

  /* -------------------------------------------- sorteeropdracht */

  function tekenSorteer(blok, moduleId, segIndex, blokIndex, opWijziging) {
    var id = vraagId(moduleId, segIndex, blokIndex);
    var stelling = el('div', 'stelling');
    stelling.appendChild(el('p', null, blok.question || 'Bij welke categorie hoort elk onderdeel?'));
    return tekenKeuzeVraag({
      label: 'Sorteeropdracht',
      stelling: stelling,
      rijen: husselVolgorde(id, blok.items.length).map(function (n) {
        return { tekst: blok.items[n].text, sleutel: n, juist: blok.items[n].pile };
      }),
      opties: blok.piles.map(function (p, j) { return { knop: p, waarde: String(j), tekst: p }; }),
      correctie: function (r) { return 'Hoort bij: ' + blok.piles[r.juist]; },
      allesGoed: 'Alles in de juiste categorie.',
      deelsGoed: 'Bij de rode staat waar ze wel horen.',
      feedback: blok.feedback,
      feedbackWrong: blok.feedbackWrong
    }, moduleId, segIndex, blokIndex, opWijziging);
  }

  /* ------------------------------------------------------------ modulepagina */

  function openModule(moduleId) {
    var les = cursus.lessons.find(function (l) { return l.id === moduleId; });
    if (!les) return toonStart();
    huidig = moduleId;
    /* Ook openen telt als voortgang: een LMS hoort dan "bezig" en de plek. */
    bewaar();

    if (opts.hash) {
      if (location.hash !== '#' + moduleId) zetAdres('#' + moduleId);
      document.title = (les.title || 'Module') + ' | ' + cursus.title;
    }
    root.innerHTML = '';

    var segmenten = segmenteer(les.blocks);
    var ms = moduleStaat(moduleId);
    if (!segmenten.length) segmenten = [[]];
    if (ms.af) ms.segment = segmenten.length - 1;
    if (ms.segment >= segmenten.length) ms.segment = segmenten.length - 1;
    var tot = opts.allesTonen ? segmenten.length - 1 : ms.segment;

    var balk = el('header', 'leesbalk');
    var binnen = el('div', 'leesbalk-inner');
    var terug = el('button', 'terug', '← Alle modules');
    terug.type = 'button';
    terug.addEventListener('click', toonStart);
    binnen.appendChild(terug);
    binnen.appendChild(el('span', 'naam', les.title));
    var teller = el('span', 'teller');
    binnen.appendChild(teller);
    balk.appendChild(binnen);
    var spoor = el('div', 'spoor');
    var vulling = el('i');
    spoor.appendChild(vulling);
    balk.appendChild(spoor);
    root.appendChild(balk);

    var lezer = el('main', 'lezer');
    var kop = el('div', 'moduletitel');
    var nr = cursus.lessons.indexOf(les) + 1;
    kop.appendChild(el('p', 'kicker', 'Module ' + nr + ' van ' + cursus.lessons.length));
    kop.appendChild(el('h1', null, les.title || 'Module ' + nr));
    if (les.deadline) {
      var dl = el('p', 'deadline-regel');
      dl.appendChild(el('span', 'deadline', 'Afronden vóór ' + les.deadline));
      kop.appendChild(dl);
    }
    lezer.appendChild(kop);
    root.appendChild(lezer);

    function werkBalkBij() {
      var zichtbaar = Math.min(Math.max(ms.segment, tot) + 1, segmenten.length);
      teller.textContent = zichtbaar + ' / ' + segmenten.length;
      vulling.style.width = Math.round((zichtbaar / segmenten.length) * 100) + '%';
    }

    function openVragen(segIndex) {
      var open = 0;
      segmenten[segIndex].forEach(function (x, i) {
        if (VRAAGTYPEN.indexOf(x.blok.t) < 0 || !telbaar(x.blok)) return;
        if (!ms.antwoorden[vraagId(moduleId, segIndex, i)]) open++;
      });
      return open;
    }

    function tekenSegment(index) {
      var seg = el('section', 'segment');
      var herbeoordeel = function () { /* wordt hieronder vervangen */ };

      segmenten[index].forEach(function (x, i) {
        var node = tekenBlok(x.blok, moduleId, index, i, function () { herbeoordeel(); });
        if (node) {
          node.setAttribute('data-blok', x.gi);
          seg.appendChild(node);
        }
      });
      if (!segmenten[index].length) seg.appendChild(el('p', 'leeg', 'Deze module heeft nog geen inhoud.'));

      lezer.appendChild(seg);

      var laatste = index === segmenten.length - 1;
      var isVoorste = index >= tot;

      if (!laatste && isVoorste) {
        var voet = el('div', 'doorgaan');
        var knop = el('button', null, 'Doorgaan');
        knop.type = 'button';
        var hint = el('div', 'hint', '');
        voet.appendChild(knop);
        voet.appendChild(hint);
        seg.appendChild(voet);

        herbeoordeel = function () {
          var open = openVragen(index);
          knop.disabled = open > 0;
          hint.textContent = open > 0
            ? (open === 1 ? 'Beantwoord eerst de vraag hierboven.' : 'Beantwoord eerst de ' + open + ' vragen hierboven.')
            : '';
        };
        herbeoordeel();

        knop.addEventListener('click', function () {
          voet.remove();
          ms.segment = Math.max(ms.segment, index + 1);
          tot = Math.max(tot, index + 1);
          bewaar();
          werkBalkBij();
          var nieuw = tekenSegment(index + 1);
          nieuw.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      } else if (laatste) {
        var slot = el('div', 'afronding');
        slot.appendChild(el('div', 'vinkje', '✓'));
        slot.appendChild(el('h2', null, 'Module doorlopen'));
        var volgende = cursus.lessons[cursus.lessons.indexOf(les) + 1];
        slot.appendChild(el('p', null, volgende
          ? 'Je hebt ' + les.title + ' afgerond. Ga verder met module ' + (nr + 1) + '.'
          : 'Je hebt de laatste module van deze cursus afgerond.'));
        var knoppen = el('div', 'knoppen');
        if (volgende) {
          var v = el('button', 'knop-klein', 'Volgende module');
          v.type = 'button';
          v.addEventListener('click', function () { openModule(volgende.id); });
          knoppen.appendChild(v);
        }
        var o = el('button', 'knop-klein stil', 'Terug naar het overzicht');
        o.type = 'button';
        o.addEventListener('click', toonStart);
        knoppen.appendChild(o);
        slot.appendChild(knoppen);
        seg.appendChild(slot);

        herbeoordeel = function () {
          if (openVragen(index) === 0 && !ms.af && !opts.allesTonen) {
            ms.af = true;
            bewaar();
          }
        };
        herbeoordeel();
      }
      return seg;
    }

    for (var i = 0; i <= tot && i < segmenten.length; i++) tekenSegment(i);
    werkBalkBij();
    naarBoven();
    if (opts.opModule) opts.opModule(moduleId);
  }

  /* ------------------------------------------------------------ opstarten */

  var start = opts.module || (opts.hash ? (location.hash || '').replace('#', '') : '');
  if (start && cursus.lessons.some(function (l) { return l.id === start; })) openModule(start);
  else toonStart();

  if (opts.hash) {
    window.addEventListener('hashchange', function () {
      var h = (location.hash || '').replace('#', '');
      if (h && h !== huidig && cursus.lessons.some(function (l) { return l.id === h; })) openModule(h);
    });
  }

  return {
    module: function () { return huidig; },
    openModule: openModule,
    toonStart: toonStart,
    wisVoortgang: function () { staat = { modules: {} }; bewaar(); },
    naarBlok: function (gi) {
      var n = root.querySelector('[data-blok="' + gi + '"]');
      if (n) n.scrollIntoView({ block: 'start' });
      return !!n;
    }
  };
}

<script>
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };

      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);

      else if (k === 'checked') e.checked = !!v;

  /* Platte tekst uit een tekstvak naar alinea's, en terug. */
  function naarHtml(tekst) {

  }
  function naarTekst(html) {

    t.innerHTML = String(html).replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|li|h\d|div|blockquote)>/gi, '\n\n');

  /* Alleen eenvoudige opmaak blijft over; scripts, stijlen en attributen gaan
     eruit. Alles wat de bouwer opslaat of exporteert gaat hier doorheen. */
  var TOEGESTAAN = { P: 1, BR: 1, STRONG: 1, EM: 1, U: 1, UL: 1, OL: 1, LI: 1, A: 1, H3: 1, H4: 1, BLOCKQUOTE: 1, SUB: 1, SUP: 1 };

  function schoonHtml(html) {
    var t = document.createElement('template');
    t.innerHTML = String(html || '');
    (function loop(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (kind) {
        if (kind.nodeType === 8) { kind.remove(); return; }
        if (kind.nodeType !== 1) return;
        var tag = kind.tagName;
        if (WEG[tag]) { kind.remove(); return; }
        loop(kind);
        if (OMZETTEN[tag]) {
          var n = document.createElement(OMZETTEN[tag]);
          while (kind.firstChild) n.appendChild(kind.firstChild);
          kind.replaceWith(n);
          kind = n;
          tag = n.tagName;
        }
        if (!TOEGESTAAN[tag]) { kind.replaceWith.apply(kind, Array.prototype.slice.call(kind.childNodes)); return; }

  /* ================================================================ links herkennen */

  function herkenVideo(url) {

    var m = url.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if (m) {
      var s = url.match(/[?&](?:t|start)=(\d+)/);
      return { youtube: m[1], start: s ? Number(s[1]) : undefined };
    }
    m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (m) return { vimeo: m[1] };
    if (/^https?:\/\//i.test(url)) return { url: url };

  /* Deellinks van bekende diensten omzetten naar hun insluit-adres. */
  function naarInsluitUrl(url) {

  /* Verkleinen tot hooguit 1600 px en zo comprimeren dat een afbeelding
     onder ~230 kB blijft; dan past hij in de opslag en blijft de export licht. */
  function verwerkBeeld(file) {
    return new Promise(function (ok, fout) {
      var lezer = new FileReader();
      lezer.onerror = fout;
      lezer.onload = function () {
        var img = new Image();
        img.onerror = fout;
        img.onload = function () {
          var schaal = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
          var w = Math.max(1, Math.round(img.naturalWidth * schaal)), hh = Math.max(1, Math.round(img.naturalHeight * schaal));
          if (schaal === 1 && lezer.result.length < 240000 && /^data:image\/(png|jpeg|webp|gif)/.test(lezer.result)) return ok({ src: lezer.result, w: w, h: hh });
          var doek = document.createElement('canvas');
          var q = 0.85, uit;
          for (var poging = 0; poging < 8; poging++) {
            doek.width = w; doek.height = hh;
            var c = doek.getContext('2d');
            c.fillStyle = '#ffffff';
            c.fillRect(0, 0, w, hh);
            c.drawImage(img, 0, 0, w, hh);
            uit = doek.toDataURL('image/jpeg', q);
            if (uit.length < 240000) break;
            if (q > 0.6) q -= 0.1; else { w = Math.round(w * 0.8); hh = Math.round(hh * 0.8); }
          }
          ok({ src: uit, w: w, h: hh });
        };
        img.src = lezer.result;
      };
      lezer.readAsDataURL(file);
    });
  }

        icoonknop('kruis', 'Sluiten', function () { S.paletNa = null; renderEditor(); })));
    PALET.forEach(function (g) {
      p.append(h('div', { class: 'palet-groep' }, h('h3', null, g.groep),
        h('div', { class: 'palet-knoppen' }, g.items.map(function (sleutel) {
          var type = TYPES[sleutel === 'quiz-multi' ? 'quiz' : sleutel];
          var naam = sleutel === 'quiz-multi' ? 'Meerdere antwoorden' : sleutel === 'quiz' ? 'Meerkeuzevraag' : type.naam;
          var uitleg = sleutel === 'quiz-multi' ? 'Meer dan één antwoord goed' : sleutel === 'quiz' ? 'Eén goed antwoord' : type.uitleg;
          return h('button', { type: 'button', onclick: function () { voegBlokIn(sleutel, naIndex); } },
            ico(sleutel === 'quiz-multi' ? 'quiz' : sleutel), h('strong', null, naam), h('small', null, uitleg));
        }))));
    });
    return p;
  }

  function voegBlokIn(sleutel, naIndex) {
    var l = les();
    var b = maakBlok(sleutel);
    var plek = naIndex === 'onder' ? l.blocks.length : naIndex + 1;
    l.blocks.splice(plek, 0, b);
    S.paletNa = null;
    S.gekozenK = b._k;
    gewijzigd(l.id);
    renderEditor();
    renderStructuur();
    var k = kaarten[b._k];
    if (k) {
      k.kaart.scrollIntoView({ block: 'center' });
      var eersteVeld = k.kaart.querySelector('input, textarea, .rijk');
      if (eersteVeld) eersteVeld.focus();
    }
  }

  function blokKaart(b, i, l) {
    var type = TYPES[b.t] || TYPES.text;
    var dicht = !!S.open[b._k];
    var kaart = h('div', { class: 'blok-kaart' + (b.t === 'continue' ? ' doorgaan-kaart' : '') + (S.gekozenK === b._k ? ' gekozen' : '') + (dicht ? ' dicht' : '') });
    var samenv = h('span', { class: 'samenvatting' });
    var waarsch = h('span');
    var naamEl = h('span');
    var kopKnop = h('button', { type: 'button', class: 'type', 'aria-expanded': dicht ? 'false' : 'true', title: dicht ? 'Uitklappen' : 'Inklappen',
      onclick: function () { S.open[b._k] = !S.open[b._k]; kaart.classList.toggle('dicht'); kopKnop.setAttribute('aria-expanded', S.open[b._k] ? 'false' : 'true'); } },
      ico(b.t), naamEl);
    var kop = h('div', { class: 'blok-kop' }, kopKnop, samenv, waarsch,
      h('span', { class: 'acties' },
        icoonknop('omhoog', 'Blok omhoog', function () { verplaats(l, i, -1); }, i === 0),
        icoonknop('omlaag', 'Blok omlaag', function () { verplaats(l, i, 1); }, i === l.blocks.length - 1),
        icoonknop('kopie', 'Blok dupliceren', function () {
          var kopie = kloon(b);
          kopie._k = nieuwId('b');
          l.blocks.splice(i + 1, 0, kopie);
          S.gekozenK = kopie._k;
          gewijzigd(l.id); renderEditor(); renderStructuur();
        }),
        icoonknop('weg', 'Blok verwijderen', function () {
          l.blocks.splice(i, 1);
          S.laatstWeg = { lesId: l.id, index: i, blok: b };
          gewijzigd(l.id); renderEditor(); renderStructuur();
          melding(type.naam + ' verwijderd.', { tekst: 'Ongedaan maken', doe: function () {
            var w = S.laatstWeg;
            var doel = S.cursus.lessons.find(function (x) { return x.id === w.lesId; });
            if (!doel) return;
            doel.blocks.splice(Math.min(w.index, doel.blocks.length), 0, w.blok);
            S.gekozenK = w.blok._k;
            gewijzigd(doel.id); renderEditor(); renderStructuur();
          } });
        })));
    var body = h('div', { class: 'blok-body' });
    var ctx = {
      body: body,
      opnieuw: function () {
        body.innerHTML = '';
        voegToe(body, type.velden(b, ctx));
        werkKopBij(b._k);
      }
    };
    voegToe(body, type.velden(b, ctx));
    kaart.append(kop, body);
    kaart.addEventListener('focusin', function () { kiesBlok(b._k); });
    kaart.addEventListener('mousedown', function () { kiesBlok(b._k); });
    kaarten[b._k] = { kaart: kaart, samenv: samenv, waarsch: waarsch, naam: naamEl, blok: b, index: i };
    werkKopBij(b._k);
    return kaart;
  }

  function werkKopBij(k) {
    var x = k && kaarten[k];
    if (!x) return;
    var type = TYPES[x.blok.t] || TYPES.text;
    x.naam.textContent = x.blok.t === 'quiz' ? (x.blok.multi ? 'Meerdere antwoorden' : 'Meerkeuzevraag') : type.naam;
    x.samenv.textContent = type.samenvatting(x.blok);
    var w = type.waarschuwing ? type.waarschuwing(x.blok) : '';
    x.waarsch.innerHTML = '';
    if (w) x.waarsch.append(h('span', { class: 'waarschuwing', title: w }, ico('let'), w));
  }

  function kiesBlok(k) {
    if (S.gekozenK === k) return;
    S.gekozenK = k;
    Object.keys(kaarten).forEach(function (key) { kaarten[key].kaart.classList.toggle('gekozen', key === k); });
    var x = kaarten[k];
    if (x && vbSpeler && vbSpeler.module() === S.lesId) vbSpeler.naarBlok(x.index);
  }

  function verplaats(l, i, stap) {
    var j = i + stap;
    if (j < 0 || j >= l.blocks.length) return;
    l.blocks.splice(j, 0, l.blocks.splice(i, 1)[0]);
    gewijzigd(l.id);
    renderEditor();
    var k = kaarten[l.blocks[j]._k];
    if (k) k.kaart.scrollIntoView({ block: 'nearest' });
  }

  function verwijderModule(l) {
    var i = S.cursus.lessons.indexOf(l);
    S.cursus.lessons.splice(i, 1);
    S.verwijderdeLessen.push(l.id);
    var volgende = S.cursus.lessons[Math.min(i, S.cursus.lessons.length - 1)];
    S.lesId = volgende ? volgende.id : null;
    gewijzigd('*');
    kiesModule(S.lesId);
    melding('Module verwijderd.');
  }

  /* ================================================================ voorbeeld (rechts) */

  var vbRoot = null, vbSpeler = null, vbTimer = null;

  function initVoorbeeld() {
    var host = $('#voorbeeld');
    var schaduw = host.attachShadow({ mode: 'open' });
    /* Het voorbeeld is smaller dan het venster; daarom reageert de mobiele
       opmaak hier op de breedte van het voorbeeld in plaats van het scherm. */
    var css = $('#speler-css').textContent.replace(/@media\s*\(max-width:\s*(\d+)px\)/g, '@container speler (max-width: $1px)');
    schaduw.append(h('style', { text: css + '\n.speler-vlak { container: speler / inline-size; min-height: 100%; }' }));
    vbRoot = h('div', { class: 'cursus' });
    schaduw.append(h('div', { class: 'speler-vlak' }, vbRoot));
  }

  function spelerCursus() { return zonderSleutels(S.cursus); }

  function tekenVoorbeeld() {
    if (!vbRoot || !S.cursus) return;
    var host = $('#voorbeeld');
    var boven = host.scrollTop;
    var module = S.vbModule === undefined ? S.lesId : S.vbModule;
    var vorige = vbSpeler ? vbSpeler.module() : undefined;
    try {
      vbSpeler = Speler(vbRoot, spelerCursus(), {
        sleutel: 'bouwer-voorbeeld:',
        voorbeeld: true,
        allesTonen: S.vb.alles,
        scroller: host,
        module: module || undefined,
        opModule: function (id) {
          S.vbModule = id;
          if (id && id !== S.lesId && S.cursus.lessons.some(function (l) { return l.id === id; })) {
            S.lesId = id;
            S.gekozenK = null;
            renderStructuur();
            renderEditor();
          }
        }
      });
    } catch (e) {
      vbRoot.textContent = 'Het voorbeeld kon niet worden getekend: ' + e.message;
      return;
    }
    if (vorige === vbSpeler.module()) host.scrollTop = boven;
  }

  function planVoorbeeld() {
    clearTimeout(vbTimer);
    vbTimer = setTimeout(tekenVoorbeeld, 350);
  }

  /* ================================================================ opslag */

  /* In je account (db, per persoon privé) als dat kan, anders in deze browser.
     Een cursus staat verdeeld over documenten: één voor de gegevens, één per
     module en één per afbeelding, zodat elk document klein blijft. */
  var Opslag = {
    modus: 'geen',
    col: null,
    beelden: {},

    start: function () {
      return Promise.all([cap('db'), cap('user')]).then(function (r) {
        var db = r[0], user = r[1];
        if (!db || !user) { Opslag.modus = 'browser'; return; }
        return Promise.resolve(user.id()).then(function (uid) {
          if (!uid) { Opslag.modus = 'browser'; return; }
          var magSchrijven = user.can ? user.can('data.write') : null;
          return Promise.resolve(magSchrijven).then(function (mag) {
            if (mag === false) { Opslag.modus = 'browser'; return; }
            Opslag.col = db.collection('data/users/' + uid);
            Opslag.modus = 'account';
          });
        });
      }).catch(function () { Opslag.modus = 'browser'; });
    },

    browserIndex: function () {
      try { return JSON.parse(ls('bouwer:index') || '[]'); } catch (e) { return []; }
    },

    lijst: function () {
      var lokaal = Opslag.browserIndex().map(function (x) { x.plek = 'browser'; return x; });
      if (Opslag.modus !== 'account') return Promise.resolve(lokaal);
      return Opslag.col.where('kind', '==', 'cursus').get().then(function (snap) {
        var lijst = snap.docs.map(function (d) { var x = d.data(); return { id: x.id, title: x.title, updatedAt: x.updatedAt, plek: 'account' }; });
        lokaal.forEach(function (x) { if (!lijst.some(function (y) { return y.id === x.id; })) lijst.push(x); });
        return lijst.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
      }).catch(function () { return lokaal; });
    },

    laad: function (id) {
      function uitBrowser() {
        var ruw = ls('bouwer:c:' + id);
        if (!ruw) throw new Error('niet gevonden');
        return JSON.parse(ruw);
      }
      if (Opslag.modus !== 'account') return Promise.resolve().then(uitBrowser);
      return Opslag.col.doc('cursus-' + id).get().then(function (meta) {
        if (!meta.exists) return uitBrowser();
        var m = meta.data();
        return Promise.all((m.lessonIds || []).map(function (lid) { return Opslag.col.doc('les-' + id + '-' + lid).get(); })).then(function (lessen) {
          return Opslag.col.where('kind', '==', 'beeld').where('cursus', '==', id).get().then(function (snap) {
            var beelden = {};
            snap.docs.forEach(function (d) { var x = d.data(); beelden[x.key] = x.data; Opslag.beelden[id + ':' + x.key] = 1; });
            var c = { id: m.id, title: m.title, subtitle: m.subtitle, author: m.author, intro: m.intro, kicker: m.kicker, updatedAt: m.updatedAt, lessons: [] };
            lessen.forEach(function (d) { if (d.exists) c.lessons.push(d.data().les); });
            c.lessons.forEach(function (l) {
              (l.blocks || []).forEach(function (b) {
                if (b.t === 'image' && /^beeld:/.test(b.src)) b.src = beelden[b.src.slice(6)] || '';
              });
            });
            return c;
          });
        });
      });
    },

    bewaar: function (c, vuil, weg) {
      var kaal = zonderSleutels(c);
      var beelden = [];
      kaal.lessons.forEach(function (l) {
        l.blocks.forEach(function (b) {
          if (b.t === 'image' && /^data:/.test(b.src)) {
            var key = hash(b.src);
            beelden.push([key, b.src]);
            b.src = 'beeld:' + key;
          }
        });
      });
      var browserGelukt = Opslag.bewaarBrowser(zonderSleutels(c));
      if (Opslag.modus !== 'account') return Promise.resolve(browserGelukt ? 'browser' : 'fout');

      var col = Opslag.col;
      var keten = Promise.resolve();
      beelden.forEach(function (x) {
        if (Opslag.beelden[c.id + ':' + x[0]]) return;
        keten = keten.then(function () {
          return col.doc('beeld-' + c.id + '-' + x[0]).set({ kind: 'beeld', cursus: c.id, key: x[0], data: x[1] }).then(function () { Opslag.beelden[c.id + ':' + x[0]] = 1; });
        });
      });
      kaal.lessons.forEach(function (l) {
        if (!vuil['*'] && !vuil[l.id]) return;
        keten = keten.then(function () { return col.doc('les-' + c.id + '-' + l.id).set({ kind: 'les', cursus: c.id, les: l }); });
      });
      weg.forEach(function (lid) {
        keten = keten.then(function () { return col.doc('les-' + c.id + '-' + lid).delete(); });
      });
      keten = keten.then(function () {
        return col.doc('cursus-' + c.id).set({
          kind: 'cursus', id: c.id, title: c.title, subtitle: c.subtitle, author: c.author, intro: c.intro, kicker: c.kicker,
          lessonIds: c.lessons.map(function (l) { return l.id; }), updatedAt: c.updatedAt
        });
      });
      return keten.then(function () { return 'account'; });
    },

    bewaarBrowser: function (c) {
      try {
        ls('bouwer:c:' + c.id, JSON.stringify(c));
        var index = Opslag.browserIndex().filter(function (x) { return x.id !== c.id; });
        index.unshift({ id: c.id, title: c.title, updatedAt: c.updatedAt });
        ls('bouwer:index', JSON.stringify(index));
        return true;
      } catch (e) {
        return false;
      }
    },

    verwijder: function (id) {
      try {
        ls('bouwer:c:' + id, null);
        ls('bouwer:index', JSON.stringify(Opslag.browserIndex().filter(function (x) { return x.id !== id; })));
      } catch (e) { /* niets */ }
      if (Opslag.modus !== 'account') return Promise.resolve();
      var col = Opslag.col;
      return Promise.all([
        col.where('cursus', '==', id).get(),
        col.doc('cursus-' + id).get()
      ]).then(function (r) {
        var keten = Promise.resolve();
        r[0].docs.forEach(function (d) { keten = keten.then(function () { return col.doc(d.id).delete(); }); });
        if (r[1].exists) keten = keten.then(function () { return col.doc('cursus-' + id).delete(); });
        return keten;
      });
    }
  };

  function hash(s) {
    var x = 2166136261;
    for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); }
    return (x >>> 0).toString(36) + s.length.toString(36);
  }

  var bewaarTimer = null, bezigMetBewaren = null;
  function planBewaar() {
    clearTimeout(bewaarTimer);
    bewaarTimer = setTimeout(bewaarNu, 1200);
  }
  function bewaarNu() {
    if (bezigMetBewaren) { planBewaar(); return bezigMetBewaren; }
    var c = S.cursus;
    if (c.voorbeeld) return Promise.resolve();
    var vuil = S.vuil, weg = S.verwijderdeLessen.slice();
    S.vuil = {};
    S.verwijderdeLessen = [];
    zetStatus('Opslaan…', 'bezig');
    bezigMetBewaren = Opslag.bewaar(c, vuil, weg).then(function (plek) {
      ls('bouwer:laatste', c.id);
      if (plek === 'fout') zetStatus('Niet opgeslagen: exporteer als bouwbestand', 'fout');
      else zetStatus(plek === 'account' ? 'Opgeslagen in je account' : 'Opgeslagen in deze browser', 'ok');
      if (!S.lijst.some(function (x) { return x.id === c.id; })) S.lijst.unshift({ id: c.id, title: c.title, updatedAt: c.updatedAt, plek: plek });
      S.lijst.forEach(function (x) { if (x.id === c.id) x.title = c.title; });
      renderKeuze();
    }).catch(function () {
      Object.keys(vuil).forEach(function (k) { S.vuil[k] = 1; });
      S.verwijderdeLessen = S.verwijderdeLessen.concat(weg);
      zetStatus('Opslaan mislukt, nieuwe poging…', 'fout');
      setTimeout(planBewaar, 4000);
    }).then(function () { bezigMetBewaren = null; });
    return bezigMetBewaren;
  }

  function zetStatus(tekst, soort) {
    var s = $('#status');
    s.textContent = tekst;
    s.setAttribute('data-soort', soort || '');
  }

  function opslagUitleg() {
    if (Opslag.modus === 'account') return 'Je werk wordt automatisch bewaard in je account, alleen zichtbaar voor jou. Exporteer om het te publiceren of te delen.';
    if (Opslag.modus === 'browser') return 'Je werk wordt bewaard in deze browser. Exporteer regelmatig een bouwbestand, zodat je het niet kwijtraakt.';
    return 'Opslag wordt geladen…';
  }

  /* ================================================================ cursussen kiezen */

  function renderKeuze() {
    var sel = $('#cursus-keuze');
    sel.innerHTML = '';
    var huidig = S.cursus;
    var lijst = S.lijst.slice();
    if (!huidig.voorbeeld && !lijst.some(function (x) { return x.id === huidig.id; })) lijst.unshift({ id: huidig.id, title: huidig.title });
    if (lijst.length) {
      sel.append(h('optgroup', { label: 'Mijn e-learnings' }, lijst.map(function (x) {
        return h('option', { value: x.id }, (x.id === huidig.id ? huidig.title : x.title) || 'Naamloze e-learning');
      })));
    }
    sel.append(h('optgroup', { label: 'Beginnen' },
      h('option', { value: '__nieuw' }, '+ Nieuwe e-learning'),
      h('option', { value: '__voorbeeld' }, 'Voorbeeld: Duurzaamheid en systeemdenken')));
    sel.value = huidig.voorbeeld ? '__voorbeeld' : huidig.id;
  }

  function wissel(c) {
    S.cursus = c;
    S.lesId = c.lessons[0] ? c.lessons[0].id : null;
    S.gekozenK = null;
    S.paletNa = null;
    S.vbModule = undefined;
    S.vuil = {};
    S.verwijderdeLessen = [];
    renderAlles();
    zetStatus(c.voorbeeld ? 'Voorbeeld: wijzigingen maken een eigen kopie' : (Opslag.modus === 'account' ? 'Opgeslagen in je account' : 'Opgeslagen in deze browser'), c.voorbeeld ? '' : 'ok');
  }

  function bewaarEerst() {
    clearTimeout(bewaarTimer);
    if (Object.keys(S.vuil).length || S.verwijderdeLessen.length) return bewaarNu();
    return bezigMetBewaren || Promise.resolve();
  }

  function openCursus(id) {
    return bewaarEerst().then(function () { return Opslag.laad(id); }).then(function (ruw) {
      wissel(normaliseerCursus(ruw));
      ls('bouwer:laatste', id);
    }).catch(function () {
      melding('Deze e-learning kon niet worden geopend.');
      renderKeuze();
    });
  }

  function voorbeeldCursus() { return normaliseerCursus(JSON.parse($('#voorbeeld-cursus').textContent)); }

  function nieuweCursus() {
    return bewaarEerst().then(function () {
      var c = normaliseerCursus({ title: 'Nieuwe e-learning', lessons: [{ id: 'm1', title: 'Module 1', blocks: [{ t: 'text', heading: 'Welkom', body: '' }] }] }, { nieuwId: true });
      wissel(c);
      S.vuil['*'] = 1;
      bewaarNu();
      var t = $('#structuur input');
      if (t) { t.focus(); t.select(); }
    });
  }

  function dupliceerCursus() {
    var c = normaliseerCursus(zonderSleutels(S.cursus), { nieuwId: true });
    c.title = c.title + ' (kopie)';
    c.updatedAt = Date.now();
    bewaarEerst().then(function () {
      wissel(c);
      S.vuil['*'] = 1;
      bewaarNu();
      melding('Kopie gemaakt.');
    });
  }

  function verwijderCursus() {
    var c = S.cursus;
    clearTimeout(bewaarTimer);
    (c.voorbeeld ? Promise.resolve() : Opslag.verwijder(c.id)).then(function () {
      S.lijst = S.lijst.filter(function (x) { return x.id !== c.id; });
      melding('E-learning verwijderd.');
      if (S.lijst.length) return openCursus(S.lijst[0].id);
      wissel(voorbeeldCursus());
    });
  }

  /* ================================================================ exporteren */

  function exportDocument(c, scorm) {
    /* "<" en de twee Unicode-regeleinden als escape, zodat de gegevens het
       script-element nooit kunnen afsluiten of breken. */
    var bs = String.fromCharCode(92);
    var data = JSON.stringify(c).split('<').join(bs + 'u003c')
      .split(String.fromCharCode(0x2028)).join(bs + 'u2028')
      .split(String.fromCharCode(0x2029)).join(bs + 'u2029');
    return '<!doctype html>\n<html lang="nl">\n<head>\n<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
      + '<meta name="generator" content="E-learning Bouwer">\n'
      + '<title>' + esc(c.title) + '</title>\n'
      + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">\n'
      + '<style>\nhtml, body { margin: 0; min-height: 100%; }\nbody { background: #F7F4F0; }\n' + $('#speler-css').textContent + '\n</style>\n'
      + '</head>\n<body>\n<div class="cursus" id="cursus"></div>\n'
      + '<script type="application/json" id="cursus-data">' + data + '<\/script>\n'
      + '<script>\n' + Speler.toString() + '\n' + (scorm ? ScormKoppeling.toString() + '\n' : '')
      + '(function () {\n  var c = JSON.parse(document.getElementById("cursus-data").textContent);\n  var o = { hash: true };\n'
      + (scorm ? '  var lms = ScormKoppeling(c);\n  if (lms.actief) o.opslag = lms;\n' : '')
      + '  Speler(document.getElementById("cursus"), c, o);\n})();\n<\/script>\n</body>\n</html>\n';
  }

  /* SCORM 1.2: zoekt de API van het LMS, bewaart de voortgang in
     cmi.suspend_data en meldt voltooiing en score. Zonder LMS doet hij niets
     en gebruikt de speler gewoon de browser. */
  function ScormKoppeling(cursus) {
    function zoek(w) {
      for (var n = 0; w && n < 12; n++) {
        try { if (w.API) return w.API; } catch (e) { return null; }
        if (w.parent === w) break;
        w = w.parent;
      }
      return null;
    }
    var api = zoek(window) || (window.opener ? zoek(window.opener) : null);
    var actief = false;
    var begin = Date.now();
    if (api) {
      try { var r = api.LMSInitialize(''); actief = r === true || r === 'true'; } catch (e) { actief = false; }
    }
    function lees(k) { try { return String(api.LMSGetValue(k) || ''); } catch (e) { return ''; } }
    function zet(k, v) { try { api.LMSSetValue(k, String(v)); } catch (e) { /* LMS weigert */ } }
    function duur(ms) {
      var s = Math.round(ms / 1000), u = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
      s = s % 60;
      return ('000' + u).slice(-4) + ':' + ('0' + m).slice(-2) + ':' + ('0' + s).slice(-2) + '.00';
    }
    if (actief) {
      var status = lees('cmi.core.lesson_status');
      if (!status || status === 'not attempted') zet('cmi.core.lesson_status', 'incomplete');
    }
    var afgesloten = false;
    function sluit() {
      if (!actief || afgesloten) return;
      afgesloten = true;
      zet('cmi.core.session_time', duur(Date.now() - begin));
      try { api.LMSCommit(''); api.LMSFinish(''); } catch (e) { /* niets */ }
    }
    window.addEventListener('pagehide', sluit);
    window.addEventListener('beforeunload', sluit);
    return {
      actief: actief,
      lees: function () { return lees('cmi.suspend_data'); },
      schrijf: function (json, staat, module) {
        if (!actief || afgesloten) return;
        zet('cmi.suspend_data', json);
        if (module) zet('cmi.core.lesson_location', module);
        var totaal = 0, goed = 0;
        cursus.lessons.forEach(function (l) {
          var ms = staat.modules[l.id];
          var vragen = l.blocks.filter(function (b) { return b.t === 'quiz' || b.t === 'match' || b.t === 'sort'; }).length;
          totaal += vragen;
          if (ms) Object.keys(ms.antwoorden || {}).forEach(function (k) { if (ms.antwoorden[k].goed) goed++; });
        });
        if (totaal) {
          zet('cmi.core.score.min', 0);
          zet('cmi.core.score.max', 100);
          zet('cmi.core.score.raw', Math.min(100, Math.round((goed / totaal) * 100)));
        }
        var af = cursus.lessons.length > 0 && cursus.lessons.every(function (l) { return staat.modules[l.id] && staat.modules[l.id].af; });
        if (af) zet('cmi.core.lesson_status', 'completed');
        try { api.LMSCommit(''); } catch (e) { /* niets */ }
      }
    };
  }

  function scormManifest(c) {
    var t = esc(c.title);

      + '<manifest identifier="MANIFEST-' + esc(c.id) + '" version="1.0"\n'
      + '  xmlns="http://www.imsproject.org/xsd/imscp_rootv1p1p2"\n'
      + '  xmlns:adlcp="http://www.adlnet.org/xsd/adlcp_rootv1p2"\n'
      + '  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"\n'
      + '  xsi:schemaLocation="http://www.imsproject.org/xsd/imscp_rootv1p1p2 imscp_rootv1p1p2.xsd http://www.imsglobal.org/xsd/imsmd_rootv1p2p1 imsmd_rootv1p2p1.xsd http://www.adlnet.org/xsd/adlcp_rootv1p2 adlcp_rootv1p2.xsd">\n'
      + '  <metadata>\n    <schema>ADL SCORM</schema>\n    <schemaversion>1.2</schemaversion>\n  </metadata>\n'
      + '  <organizations default="ORG-1">\n    <organization identifier="ORG-1">\n      <title>' + t + '</title>\n'
      + '      <item identifier="ITEM-1" identifierref="RES-1" isvisible="true">\n        <title>' + t + '</title>\n      </item>\n'
      + '    </organization>\n  </organizations>\n'
      + '  <resources>\n    <resource identifier="RES-1" type="webcontent" adlcp:scormtype="sco" href="index.html">\n      <file href="index.html"/>\n    </resource>\n  </resources>\n'

  }

  /* Een zip zonder compressie: genoeg voor een SCORM-pakket en geen bibliotheek nodig. */
  var CRC = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }

    var enc = new TextEncoder(), delen = [], centraal = [], offset = 0;
    var d = new Date();
    var tijd = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    var datum = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    bestanden.forEach(function (b) {
      var naam = enc.encode(b.naam), data = typeof b.data === 'string' ? enc.encode(b.data) : b.data, crc = crc32(data);
      var kop = new DataView(new ArrayBuffer(30));
      kop.setUint32(0, 0x04034b50, true); kop.setUint16(4, 20, true); kop.setUint16(6, 0x0800, true); kop.setUint16(8, 0, true);
      kop.setUint16(10, tijd, true); kop.setUint16(12, datum, true); kop.setUint32(14, crc, true);
      kop.setUint32(18, data.length, true); kop.setUint32(22, data.length, true); kop.setUint16(26, naam.length, true); kop.setUint16(28, 0, true);
      delen.push(new Uint8Array(kop.buffer), naam, data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, tijd, true); c.setUint16(14, datum, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, naam.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true);
      c.setUint32(38, 0, true); c.setUint32(42, offset, true);
      centraal.push(new Uint8Array(c.buffer), naam);
      offset += 30 + naam.length + data.length;
    });
    var grootte = centraal.reduce(function (s, x) { return s + x.length; }, 0);

    eind.setUint32(0, 0x06054b50, true); eind.setUint16(4, 0, true); eind.setUint16(6, 0, true);
    eind.setUint16(8, bestanden.length, true); eind.setUint16(10, bestanden.length, true);
    eind.setUint32(12, grootte, true); eind.setUint32(16, offset, true); eind.setUint16(20, 0, true);
    return new Blob(delen.concat(centraal, [new Uint8Array(eind.buffer)]), { type: 'application/zip' });
  }

  function bewaarBestand(naam, data) {

        });
      }
      /* Buiten Claude: gewoon een downloadlink. */
      var blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });

      var a = h('a', { href: url, download: naam });
      document.body.append(a);

  function controleer(c) {

  }

  /* ================================================================ Claude */

  var SCHEMA = [
    'Bloktypen (JSON-objecten met precies deze velden):',

    '- {"t":"quiz","multi":false,"question":"vraag","options":[{"text":"antwoord","correct":true,"feedback":"waarom dit wel of niet klopt"}],"feedback":"uitleg na een goed antwoord","feedbackWrong":"uitleg na een fout antwoord"}  (3 tot 5 opties; multi true als er meer goede antwoorden zijn)',
    '- {"t":"match","question":"opdracht","pairs":[{"left":"begrip","right":"omschrijving"}],"feedback":"uitleg"}  (3 tot 6 paren)',

    'Elke kennisvraag heeft minstens één juist antwoord, aannemelijke foute antwoorden en uitleg per antwoord.'

  function claudeFout(e) {

    if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') {

      renderEditor();
      return 'Claude is niet beschikbaar in deze bouwer.';
    }
    if (code === 'rate_limited') return 'Even te veel verzoeken. Probeer het over een minuut opnieuw.';
    if (code === 'prompt_too_large') return 'De tekst is te lang. Plak een kortere tekst of een samenvatting.';
    if (code === 'invalid_json') return 'Claude gaf geen bruikbaar antwoord. Probeer het opnieuw, eventueel met een kortere tekst.';
    if (code === 'refused') return 'Claude wilde dit niet maken. Pas de tekst aan en probeer het opnieuw.';

  function vraagClaude(prompt, voortgang, ctl) {

  function claudeDialoog(cfg) {

          + 'Toegestane vraagvormen: ' + (['quiz', 'match', 'sort'].filter(function (s) { return wensen.indexOf(s) >= 0; }).join(', ') || 'quiz') + '.\n\n'

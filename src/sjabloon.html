<title>E-learning Bouwer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Werkplaats in drie banen: structuur links, het blok dat je bewerkt in het
   midden, de echte speler rechts. Groen zoals de minor, de speler houdt zijn
   eigen warme palet. */
:root {
  --bg: #f1f3ee;
  --paneel: #ffffff;
  --vlak: #f6f7f3;
  --lijn: #dde2d8;
  --tekst: #1c2b24;
  --tekst-2: #5d6d65;
  --tekst-3: #87958d;
  --accent: #2c6a4d;
  --accent-sterk: #1f5039;
  --accent-zacht: #e2eee6;
  --op-accent: #ffffff;
  --waarschuwing: #a8521f;
  --waarschuwing-zacht: #f8eadf;
  --gevaar: #b23a2e;
  --gevaar-zacht: #f9e5e2;
  --schaduw: 0 10px 30px rgba(20, 40, 30, 0.12);
  --f-kop: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-tekst: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --paneel: #181f1b; --vlak: #1e2621; --lijn: #2b3630;
    --tekst: #e5ece7; --tekst-2: #a3b2a9; --tekst-3: #77877e;
    --accent: #7cc39a; --accent-sterk: #a3dbb9; --accent-zacht: #203a2c; --op-accent: #0f1a14;
    --waarschuwing: #e2a172; --waarschuwing-zacht: #3a2a1d; --gevaar: #ef8b7f; --gevaar-zacht: #3b2220;
    --schaduw: 0 10px 30px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --paneel: #181f1b; --vlak: #1e2621; --lijn: #2b3630;
  --tekst: #e5ece7; --tekst-2: #a3b2a9; --tekst-3: #77877e;
  --accent: #7cc39a; --accent-sterk: #a3dbb9; --accent-zacht: #203a2c; --op-accent: #0f1a14;
  --waarschuwing: #e2a172; --waarschuwing-zacht: #3a2a1d; --gevaar: #ef8b7f; --gevaar-zacht: #3b2220;
  --schaduw: 0 10px 30px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--tekst);
  font-family: var(--f-tekst);
  font-size: 14px;
  overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paneel); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-kop); letter-spacing: -0.01em; text-wrap: balance; margin: 0; }

.app { height: 100%; display: flex; flex-direction: column; }

/* ---------------------------------------------------------------- bovenbalk */
.bovenbalk {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  min-height: 56px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--paneel);
  border-bottom: 1px solid var(--lijn);
}
.merk { display: flex; align-items: center; gap: 10px; font-family: var(--f-kop); font-weight: 800; font-size: 15px; white-space: nowrap; }
.merk-teken { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--op-accent); display: grid; place-items: center; }
.cursuskeuze { min-width: 0; flex: 1 1 220px; max-width: 360px; }
.cursuskeuze select { width: 100%; }
/* De status is ook de knop naar 'waar staat mijn werk'. */
.status { font: inherit; font-size: 12px; color: var(--tekst-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; max-width: 340px; padding: 5px 9px; border: 1px solid transparent; border-radius: 999px; background: none; cursor: pointer; }
.status:hover { border-color: var(--lijn); background: var(--vlak); }
.status-tekst { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* Vanaf tabletbreedte één regel: keuzelijst en status krimpen, de knoppen niet. */
@media (min-width: 900px) {
  .bovenbalk { flex-wrap: nowrap; }
  .cursuskeuze { flex: 1 1 160px; min-width: 140px; }
  .status { flex: 0 1 auto; }
  .bovenbalk .acties { flex: 0 0 auto; flex-wrap: nowrap; }
}
.status::before { content: ""; flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: var(--tekst-3); }
.status[data-soort="ok"]::before { background: var(--accent); }
.status[data-soort="bezig"]::before { background: var(--waarschuwing); }
.status[data-soort="fout"]::before { background: var(--gevaar); }
.status[data-soort="let"] { color: var(--accent-sterk); background: var(--accent-zacht); }
.status[data-soort="let"]::before { background: var(--accent); }
.bovenbalk .acties { display: flex; gap: 8px; flex-wrap: wrap; }
/* Controleren hoort bij de acties; op een telefoon staat hij naast de status. */
#knop-controle { margin-left: auto; margin-right: -4px; flex: 0 0 auto; }
@media (min-width: 761px) and (max-width: 899px) { .bovenbalk .acties { margin-left: auto; } }

/* ---------------------------------------------------------------- knoppen en velden */
.knop {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 36px; padding: 7px 13px;
  border: 1px solid var(--lijn); border-radius: 8px;
  background: var(--paneel); color: var(--tekst);
  font-weight: 600; font-size: 13px; white-space: nowrap;
}
.knop:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-sterk); }
.knop.primair { background: var(--accent); border-color: var(--accent); color: var(--op-accent); }
.knop.primair:hover:not(:disabled) { background: var(--accent-sterk); border-color: var(--accent-sterk); color: var(--op-accent); }
.knop.claude { border-color: var(--accent); color: var(--accent-sterk); background: var(--accent-zacht); }
.knop.gevaar { color: var(--gevaar); }
.knop.gevaar.vast { background: var(--gevaar); border-color: var(--gevaar); color: #fff; }
.knop.klein { min-height: 30px; padding: 4px 10px; font-size: 12px; }
.knop:disabled { opacity: 0.5; cursor: default; }
.icoonknop {
  width: 30px; height: 30px; display: inline-grid; place-items: center;
  border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--tekst-2);
}
.icoonknop:hover:not(:disabled) { background: var(--vlak); color: var(--tekst); border-color: var(--lijn); }
.icoonknop:disabled { opacity: 0.35; cursor: default; }
.icoonknop svg, .knop svg { width: 16px; height: 16px; flex: 0 0 auto; }

input[type="text"], input[type="url"], input[type="number"], select, textarea {
  width: 100%; box-sizing: border-box;
  padding: 8px 10px;
  border: 1px solid var(--lijn); border-radius: 8px;
  background: var(--paneel);
  font-size: 13.5px; line-height: 1.45;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus, .rijk:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-zacht); }
.veld { display: grid; gap: 5px; min-width: 0; }
.veld > label, .veldlabel { font-size: 11.5px; font-weight: 600; color: var(--tekst-2); letter-spacing: 0.02em; }
.veld .hulp { font-size: 11.5px; color: var(--tekst-3); line-height: 1.45; }
.velden { display: grid; gap: 12px; }
.twee { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
/* Grids krimpen mee met het scherm in plaats van mee te groeien met lange inhoud. */
.editor, .editor-kop, .blokken, .velden, .veld, .blok-body, .reeks, .reeks-item, .palet, .dialoog, .keuzelijst { grid-template-columns: minmax(0, 1fr); }
.schakel { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tekst); }
.schakel input { width: 16px; height: 16px; accent-color: var(--accent); }

/* ---------------------------------------------------------------- werkruimte */
/* De zijbanen klap je in tot een smalle strook of sleep je breder; de breedtes
   zet bouwer.js als --baan-l en --baan-r. */
.werk {
  flex: 1 1 auto; min-height: 0;
  display: grid; position: relative;
  grid-template-columns: var(--baan-l, 280px) minmax(0, 1fr) var(--baan-r, minmax(380px, 40%));
}
.werk.slepen { cursor: col-resize; user-select: none; }
.baan { min-height: 0; overflow: auto; grid-row: 1; }
.baan-structuur { grid-column: 1; background: var(--paneel); border-right: 1px solid var(--lijn); }
.baan-editor { grid-column: 2; }
.baan-voorbeeld { grid-column: 3; display: flex; flex-direction: column; border-left: 1px solid var(--lijn); background: var(--vlak); overflow: hidden; }

.rail { display: none; grid-row: 1; min-height: 0; overflow: auto; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; background: var(--paneel); }
.rail-links { grid-column: 1; border-right: 1px solid var(--lijn); }
.rail-rechts { grid-column: 3; border-left: 1px solid var(--lijn); background: var(--vlak); }
.rail-label { writing-mode: vertical-rl; background: none; border: 0; padding: 8px 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 700; color: var(--tekst-2); }
.rail-label:hover { color: var(--accent-sterk); }
.rail-modules { display: grid; gap: 4px; margin: 4px 0 0; padding: 0; list-style: none; }
.rail-modules button { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; padding: 0; font-size: 11px; font-weight: 700; background: var(--vlak); color: var(--tekst-2); border: 1px solid var(--lijn); }
.rail-modules button:hover { border-color: var(--accent); }
.rail-modules button.actief { background: var(--accent); border-color: var(--accent); color: var(--op-accent); }

.sleep { display: none; position: absolute; top: 0; bottom: 0; width: 9px; z-index: 6; cursor: col-resize; touch-action: none; }
.sleep::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: transparent; }
.sleep:hover::after, .sleep:focus-visible::after, .werk.slepen .sleep::after { left: 3px; width: 3px; background: var(--accent); }
.sleep:focus-visible { outline: none; }
.sleep-links { left: calc(var(--baan-l, 280px) - 5px); }
.sleep-rechts { right: calc(var(--baan-r, 40%) - 5px); }

.paneel-knoppen { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--lijn); border-radius: 9px; background: var(--paneel); }
.paneel-knoppen .icoonknop[aria-pressed="true"] { color: var(--accent-sterk); background: var(--accent-zacht); }

@media (min-width: 761px) {
  .werk[data-links="dicht"] .baan-structuur { display: none; }
  .werk[data-links="dicht"] .rail-links { display: flex; }
  .sleep-links { display: block; }
}
@media (min-width: 1181px) {
  .werk[data-rechts="dicht"] .baan-voorbeeld { display: none; }
  .werk[data-rechts="dicht"] .rail-rechts { display: flex; }
  .sleep-rechts { display: block; }
  /* Met beide zijbanen dicht krijgt de editor de ruimte. */
  .werk[data-links="dicht"][data-rechts="dicht"] .editor { max-width: 1000px; }
}
.segment-keuze.tabs-smal { display: none; }
.tabs-smal .alleen-mobiel { display: none; }

.sectie { padding: 18px 16px; border-bottom: 1px solid var(--lijn); }
.sectie-kop { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.sectie-kop h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--tekst-2); font-weight: 700; }

.modulelijst { display: grid; gap: 4px; margin: 0 0 12px; padding: 0; list-style: none; }
.module-item {
  display: grid; grid-template-columns: 18px 16px 26px minmax(0, 1fr); align-items: center; gap: 2px 6px;
  padding: 6px 8px 6px 2px; border-radius: 8px; border: 1px solid transparent; position: relative;
}
.module-item .klap { width: 18px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--tekst-3); }
.module-item .klap:hover:not(:disabled) { color: var(--tekst); background: var(--paneel); }
.module-item .klap:disabled { opacity: 0.3; cursor: default; }
.module-item .klap svg { width: 13px; height: 13px; transition: transform 0.12s ease; }
.module-item .klap[aria-expanded="true"] svg { transform: rotate(90deg); }
.module-item > .greep { width: 16px; }
.blokkenlijst { grid-column: 3 / -1; list-style: none; margin: 4px 0 2px; padding: 0 0 0 4px; display: grid; gap: 1px; position: relative; border-left: 1px solid var(--lijn); }
.blok-item { display: grid; grid-template-columns: 16px minmax(0, 1fr) 8px; align-items: center; gap: 4px; }
.blok-item .greep { width: 16px; height: 24px; opacity: 0; }
.blok-item:hover .greep, .blok-item .greep:focus-visible { opacity: 1; }
@media (hover: none) { .blok-item .greep { opacity: 0.6; } }
.blok-item .ga { display: grid; grid-template-columns: 14px minmax(0, 1fr); align-items: center; gap: 7px; min-width: 0; text-align: left; border: 0; background: none; padding: 4px 6px; border-radius: 6px; font-size: 12px; color: var(--tekst-2); }
.blok-item .ga svg { width: 14px; height: 14px; color: var(--accent); }
.blok-item .ga .naam { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blok-item .ga:hover { background: var(--paneel); color: var(--tekst); }
.blok-item.gekozen .ga { background: var(--paneel); color: var(--tekst); box-shadow: inset 2px 0 0 var(--accent); }
.blok-item.rustig .ga { color: var(--tekst-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.blok-item.rustig .ga svg { color: var(--tekst-3); }
.stip { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.stip.rood { background: var(--waarschuwing); }
.stip.open { border: 1.5px solid var(--tekst-3); }
.module-item:hover { background: var(--vlak); }
.module-item.actief { background: var(--accent-zacht); border-color: var(--accent); }
.module-item .nr { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--vlak); color: var(--tekst-2); border: 1px solid var(--lijn); }
.module-item.actief .nr { background: var(--accent); border-color: var(--accent); color: var(--op-accent); }
.module-item .kies { text-align: left; background: none; border: 0; padding: 0; min-width: 0; }
.module-item .kies strong { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.module-item .kies small { display: block; font-size: 11px; color: var(--tekst-3); margin-top: 1px; }
.module-item .mini { display: flex; gap: 0; opacity: 0; }
.module-item:hover .mini, .module-item.actief .mini, .module-item:focus-within .mini { opacity: 1; }
.knoprij { display: flex; gap: 8px; flex-wrap: wrap; }
.sectie .hulp { font-size: 11.5px; color: var(--tekst-3); line-height: 1.45; }
.sectie .hulp.let-op { color: var(--waarschuwing); }

/* Designsjablonen: een staaltje met achtergrond, accent en tekstkleur. */
.sjablonen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.sjabloon { display: grid; gap: 2px; align-content: start; text-align: left; padding: 7px; border: 1px solid var(--lijn); border-radius: 9px; background: var(--paneel); min-width: 0; }
.sjabloon:hover { border-color: var(--accent); }
.sjabloon[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-zacht); box-shadow: inset 0 0 0 1px var(--accent); }
.sjabloon strong { font-size: 12.5px; font-weight: 600; }
.sjabloon small { font-size: 11px; color: var(--tekst-3); line-height: 1.35; }
.staal { display: flex; gap: 4px; height: 24px; padding: 4px; margin-bottom: 4px; border: 1px solid; border-radius: 6px; box-sizing: border-box; }
.staal i { border-radius: 3px; }
.staal i:first-child { flex: 3; }
.staal i:last-child { flex: 1; }
.kleurrij { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kleurrij input[type="color"] { width: 40px; height: 30px; padding: 2px; border: 1px solid var(--lijn); border-radius: 7px; background: var(--paneel); cursor: pointer; }

/* ---------------------------------------------------------------- editor */
.baan-editor { padding-block: 22px 120px; padding-left: max(16px, 3vw); padding-right: max(16px, 3vw); }
.editor { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
.editor-kop { display: grid; gap: 12px; padding-bottom: 6px; }
.editor-kop .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); font-weight: 700; }
.editor-kop .titelveld { font-family: var(--f-kop); font-size: 22px; font-weight: 800; padding: 8px 10px; }
.editor-kop .rij { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.editor-kop .rij .veld { flex: 1 1 200px; }

.blokken { display: grid; gap: 0; }
.blok-kaart {
  background: var(--paneel);
  border: 1px solid var(--lijn);
  border-radius: var(--r);
  transition: border-color 0.12s ease, box-shadow 0.12s ease;
}
.blok-kaart { scroll-margin-block: 12px; }
.blok-kaart.gekozen { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-zacht); }
.blok-kop { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 4px; min-height: 42px; }
.blok-kop .type { display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--tekst-2); background: none; border: 0; padding: 4px 4px 4px 0; border-radius: 6px; }
.blok-kop .type:hover { color: var(--tekst); }
.blok-kop .type svg { width: 15px; height: 15px; color: var(--accent); }
.blok-kop .type .pijl { display: inline-grid; place-items: center; width: 16px; }
.blok-kop .type .pijl svg { width: 13px; height: 13px; color: var(--tekst-3); transform: rotate(90deg); transition: transform 0.12s ease; }
.blok-kaart.dicht .blok-kop .type .pijl svg { transform: none; }
.blok-kop .samenvatting { flex: 1; min-width: 0; font-size: 12.5px; color: var(--tekst-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.blok-kop .kop-punten { display: contents; }
.blok-kop .waarschuwing { flex: 0 1 auto; min-width: 0; max-width: 45%; white-space: nowrap; }
.blok-kop .waarschuwing svg { flex: 0 0 auto; }
.blok-kop .waarschuwing .kort { overflow: hidden; text-overflow: ellipsis; }
.blok-kop .acties { display: flex; gap: 0; }
.greep { width: 22px; height: 30px; flex: 0 0 auto; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--tekst-3); cursor: grab; touch-action: none; }
.greep:hover { color: var(--tekst); background: var(--vlak); }
.greep svg { width: 14px; height: 14px; fill: currentColor; stroke: none; }
.sleepbaar.wordt-gesleept { opacity: 0.4; }
body.aan-het-slepen, body.aan-het-slepen * { cursor: grabbing !important; user-select: none; }
.blokken, .modulelijst { position: relative; }
.sleep-lijn { position: absolute; left: 0; right: 0; height: 3px; margin-top: -1.5px; border-radius: 2px; background: var(--accent); pointer-events: none; z-index: 3; }
.onaf-label { display: inline-block; flex: 0 1 auto; min-width: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; font-weight: 600; color: var(--tekst-2); background: var(--vlak); border: 1px solid var(--lijn); padding: 2px 8px; border-radius: 6px; }
.blokken-balk { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: -4px 0 -6px; font-size: 12px; color: var(--tekst-3); }
.blokken-balk .aantal { margin-right: auto; }
.knop-tekst { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 5px 8px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--accent-sterk); }
.knop-tekst svg { width: 14px; height: 14px; }
.knop-tekst:hover:not(:disabled) { background: var(--accent-zacht); }
.knop-tekst:disabled { color: var(--tekst-3); opacity: 0.6; cursor: default; }
.editor-kop .titelrij { display: flex; align-items: center; gap: 6px; }
.editor-kop .titelrij .titelveld { flex: 1 1 auto; min-width: 0; }
.editor-kop .titelrij .icoonknop { width: 36px; height: 36px; }
.deadline-regel { justify-self: start; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 4px; margin-top: -6px; border-radius: 6px; font-size: 12.5px; color: var(--tekst-2); }
.deadline-regel svg { width: 14px; height: 14px; color: var(--accent); }
